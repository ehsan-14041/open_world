<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F7F5F0; --raised:#FFFFFF; --sunk:#EFEDE6; --ink:#1D2A2F; --muted:#5D6E75; --rule:#E0DED5;
  --grid:#E9E7DF; --a:#7A8A91; --b:#1E7A5E; --c:#B07C1E; --crit:#B4453B; --focus:#1E7A5E;
  --win:#2E3F46; --win-ink:#FFFFFF; --win-soft:rgba(46,63,70,.07);
  --a-soft:rgba(122,138,145,.10); --b-soft:rgba(30,122,94,.09); --c-soft:rgba(176,124,30,.10);
  --shadow-1:0 1px 2px rgba(29,42,47,.05);
  --shadow-2:0 1px 2px rgba(29,42,47,.05),0 10px 30px -14px rgba(29,42,47,.16);
  --shadow-3:0 2px 4px rgba(29,42,47,.06),0 20px 44px -18px rgba(29,42,47,.22);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
}
html[dir="rtl"]{
  --display:"Vazirmatn","Segoe UI",system-ui,sans-serif;
  --body:"Vazirmatn","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181A; --raised:#1B2022; --sunk:#222829; --ink:#E9EAE5; --muted:#9BA7AC; --rule:#2A3134;
    --grid:#232A2C; --a:#8FA0A7; --b:#4FB58E; --c:#D6A536; --crit:#E07A6E; --focus:#4FB58E;
  --win:#D8DEE0; --win-ink:#14181A; --win-soft:rgba(216,222,224,.08);
    --win:#D8DEE0; --win-ink:#14181A; --win-soft:rgba(216,222,224,.08);
    --a-soft:rgba(143,160,167,.14); --b-soft:rgba(79,181,142,.13); --c-soft:rgba(214,165,54,.14);
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-3:0 2px 4px rgba(0,0,0,.35),0 20px 44px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#14181A; --raised:#1B2022; --sunk:#222829; --ink:#E9EAE5; --muted:#9BA7AC; --rule:#2A3134;
  --grid:#232A2C; --a:#8FA0A7; --b:#4FB58E; --c:#D6A536; --crit:#E07A6E; --focus:#4FB58E;
  --a-soft:rgba(143,160,167,.14); --b-soft:rgba(79,181,142,.13); --c-soft:rgba(214,165,54,.14);
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-3:0 2px 4px rgba(0,0,0,.35),0 20px 44px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
.options>*,.groups>*,.limits>*,.fields>*,.grp li>*,.unknown-grid>*,.influence li>*{min-width:0}
html,body{overflow-x:hidden}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;
     line-height:1.55;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
html[dir="rtl"] body{font-size:16.5px;line-height:1.85}
a{color:inherit}
p{margin:0;max-width:64ch}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:500;font-size:clamp(31px,5vw,52px);line-height:1.07;letter-spacing:-.015em}
html[dir="rtl"] h1{font-weight:700;letter-spacing:0;line-height:1.4}
h2{font-family:var(--display);font-weight:500;font-size:clamp(23px,3.1vw,33px);line-height:1.18;letter-spacing:-.01em}
html[dir="rtl"] h2{font-weight:700;letter-spacing:0;line-height:1.5}
h3{font-size:17px;font-weight:600}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
@media (max-width:600px){.wrap{padding:0 16px}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-size:13px;text-transform:none}
.muted{color:var(--muted)} .small{font-size:14px} .neg{color:var(--crit)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wA{--wc:var(--a)} .wB{--wc:var(--b)} .wC{--wc:var(--c)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);
     backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.mark{font-weight:700;white-space:nowrap}
.mark a{text-decoration:none}
.bizpick{display:flex;align-items:center;background:var(--sunk);border:1px solid var(--rule);border-radius:999px}
.bizpick select{background:transparent;border:0;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;min-height:44px}
.badge{font-size:12px;font-weight:600;color:var(--c);border:1px solid currentColor;border-radius:999px;padding:3px 10px;white-space:nowrap}
.spacer{margin-inline-start:auto}
.langs{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--sunk)}
.langs button{border:0;background:transparent;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);min-height:44px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

section{padding:52px 0}
section+section{border-top:1px solid var(--rule)}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.sec-head.tight{margin-bottom:14px}
.sec-head.tight h2{font-size:clamp(21px,2.6vw,27px)}
#money{padding-top:10px}
.lede{font-size:19px;color:var(--muted)}
@media (max-width:600px){section{padding:38px 0}.lede{font-size:17px}}

#decision{padding-top:42px}
.changed{display:inline-flex;align-items:center;gap:9px;background:var(--c-soft);border-radius:999px;
         padding:7px 15px;font-size:14.5px;font-weight:600;margin-bottom:18px;max-width:100%}
.changed .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:0 0 auto}
#decision .lede{margin-top:14px;max-width:56ch}
.whoami{margin-top:16px;font-size:14px;color:var(--muted)}
/* Sized to be read before the cards are, and to survive being the only thing a reader takes in. */
.verdict{margin:22px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(19px,2.3vw,25px);
         line-height:1.32;letter-spacing:-.01em;max-width:30ch;text-wrap:balance}
html[dir="rtl"] .verdict{font-weight:700;letter-spacing:0;line-height:1.7;max-width:34ch}
.verdict b{border-bottom:2px solid var(--win);padding-bottom:1px}
/* The decision arrives rather than appearing, once, on first paint only. Anything the reader
   triggers themselves is not animated — they already know they did it. */
@media (prefers-reduced-motion:no-preference){
  .intro-1,.intro-2{animation:rise .28s cubic-bezier(.32,.72,0,1) both}
  .intro-2{animation-delay:.05s}
  .intro-3{animation-delay:.1s}
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* Six named rows, and every card lays its parts on the same ones, so the per-month figure,
   the demand change and the 90-day cash all sit at the same height across the three. Browsers
   without subgrid fall back to the reserved-height rules further down, which get close. */
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;
         grid-template-rows:auto auto auto auto auto auto}
.opt{grid-row:span 6}
@supports (grid-template-rows:subgrid){
  .opt{display:grid;grid-template-rows:subgrid;gap:15px}
}
@media (max-width:860px){
  .options{grid-template-columns:1fr;gap:16px;grid-template-rows:none}
  .opt{grid-row:auto}
  @supports (grid-template-rows:subgrid){.opt{grid-template-rows:auto}}
}
.opt{position:relative;background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-lg);
     padding:26px 22px 22px;display:flex;flex-direction:column;gap:15px;box-shadow:var(--shadow-2)}
.opt.lead{border-color:var(--win);box-shadow:0 0 0 2px var(--win) inset,var(--shadow-3);
          background:linear-gradient(var(--win-soft),var(--win-soft)),var(--raised)}
.opt-head{display:flex;align-items:center;gap:11px}
.letter{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;
        color:#fff;background:var(--wc);font-size:15px;flex:0 0 auto;font-family:"Source Sans 3",sans-serif}
.opt .name{font-size:19.5px;font-weight:600;line-height:1.3}
html[dir="rtl"] .opt .name{font-size:18px;line-height:1.6}
/* Room for two lines whether or not this card needs them, so every card's figures sit on
   the same line as its neighbours' and the three can be read across. */
.opt-head{min-height:calc(2 * 1.3 * 19.5px)}
html[dir="rtl"] .opt-head{min-height:calc(2 * 1.6 * 18px)}
@media (max-width:720px){.opt-head{min-height:0}}
.lead-tag{position:absolute;top:-14px;inset-inline-start:18px;font-size:12px;font-weight:700;
          letter-spacing:.02em;color:var(--win-ink);background:var(--win);
          padding:7px 14px;border-radius:999px;box-shadow:var(--shadow-2);
          display:inline-flex;align-items:center;gap:7px;white-space:nowrap;max-width:calc(100% - 36px)}
.lead-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
@media (max-width:400px){.lead-tag{font-size:11px;padding:6px 11px}}
html[dir="rtl"] .lead-tag{letter-spacing:0;font-size:12px;text-transform:none}
.money{font-size:clamp(31px,4.2vw,39px);font-weight:600;line-height:1;letter-spacing:-.015em}
html[dir="rtl"] .money{letter-spacing:0}
/* Persian sits lower on the line and carries marks above and below it, so headings need room
   they do not need in Latin — otherwise a zir or a hamze is shaved off by the line box. */
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{padding-block:.06em}
html[dir="rtl"] .lead-tag,html[dir="rtl"] .pill,html[dir="rtl"] .badge{line-height:1.75}
html[dir="rtl"] .seg button{line-height:1.7}
/* Columns of figures only line up if every digit is the same width. */
.money,.rowline .v,.mini td,.mini th,.grp li .v,.influence .pill,.opt .robust b,.verdict b,
#chart text,.sticky-t{font-variant-numeric:tabular-nums}
/* A figure or a Latin name inside a Persian sentence keeps its own direction, and does not
   drag the punctuation around it to the wrong end of the line. */
html[dir="rtl"] .verdict b,html[dir="rtl"] .flipline b,html[dir="rtl"] .effect b,
html[dir="rtl"] #why-p,html[dir="rtl"] .robust b{unicode-bidi:isolate}
.money-l{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.rowline{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--rule);padding-top:13px;flex-wrap:wrap}
.rowline .v{font-size:20px;font-weight:600} .rowline .l{font-size:13.5px;color:var(--muted)}
.robust{font-size:13.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--rule);padding-top:13px}
.robust b{color:var(--wc);font-weight:700}
.opt details summary{font-size:13.5px;color:var(--muted);cursor:pointer;font-weight:600;list-style:none}
.opt details summary::-webkit-details-marker{display:none}
.opt details summary::after{content:"+"} .opt details[open] summary::after{content:"−"}
.opt details .inner{font-size:13.5px;color:var(--muted);margin-top:9px;line-height:1.55}

.why{margin-top:32px;background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-md);
     padding:22px 24px;box-shadow:var(--shadow-1);max-width:76ch}
.why h3{font-family:var(--display);font-weight:500;font-size:21px;margin-bottom:9px}
html[dir="rtl"] .why h3{font-weight:700}
.why p{font-size:17px;max-width:none}
.scenario{margin-top:16px;font-size:13.5px;color:var(--muted)}

.chart-wrap{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-md);
            padding:18px 14px 10px;position:relative;box-shadow:var(--shadow-1)}
.chart-wrap svg{width:100%;height:auto;display:block;touch-action:pan-y;direction:ltr}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;
     padding:9px 11px;border-radius:var(--r-sm);display:none;min-width:160px;box-shadow:var(--shadow-2);z-index:2}
.tip b{display:block;margin-bottom:5px}
.tip span{display:flex;justify-content:space-between;gap:12px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-top:10px;padding:0 4px}
.legend span::before{content:"";display:inline-block;width:15px;height:3px;border-radius:2px;
                     margin-inline-end:7px;vertical-align:middle;background:var(--wc)}
.note{font-size:13.5px;color:var(--muted);margin-top:14px;max-width:72ch}
.mini{margin-top:24px;border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;background:var(--raised)}
.mini table{width:100%;border-collapse:collapse;font-size:15px}
.mini th,.mini td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--rule)}
.mini tr:last-child th,.mini tr:last-child td{border-bottom:0}
.mini thead th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
/* A column header sits over its own figures, and follows them when the writing direction
   flips the figures but not the table. */
.mini thead th:not(:first-child){text-align:end}
html[dir="rtl"] .mini thead th:not(:first-child){text-align:start}
html[dir="rtl"] .mini thead th{letter-spacing:0;text-transform:none}
.mini td{text-align:end;font-weight:600}
.mini th[scope="row"]{font-weight:400;color:var(--muted)}
@media (max-width:600px){.mini table{font-size:14px}.mini th,.mini td{padding:10px 8px}}

.unknown{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-lg);
         box-shadow:var(--shadow-2);overflow:hidden}
.unknown-top{padding:26px 26px 22px;border-bottom:1px solid var(--rule);background:var(--c-soft)}
.unknown-top .eyebrow{color:var(--c)}
.unknown-top h2{margin-top:8px;font-size:clamp(21px,2.6vw,28px)}
.unknown-grid{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:720px){.unknown-grid{grid-template-columns:1fr}}
.unknown-grid>div{padding:22px 26px;border-bottom:1px solid var(--rule)}
.unknown-grid>div:nth-child(odd){border-inline-end:1px solid var(--rule)}
@media (max-width:720px){.unknown-grid>div:nth-child(odd){border-inline-end:0}}
.unknown-grid .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
html[dir="rtl"] .unknown-grid .k{letter-spacing:0;font-size:13px;text-transform:none}
.unknown-grid p{font-size:15.5px;max-width:none}
.unknown-cta{padding:20px 26px}

.influence{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:var(--r-md);
           overflow:hidden;background:var(--raised)}
.influence li{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--rule)}
.influence li:last-child{border-bottom:0}
.influence .nm{flex:1;font-size:15.5px}
.influence .eff{font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
.pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.high{background:var(--c-soft);color:var(--c)} .pill.med{background:var(--a-soft);color:var(--muted)}
.flipline{margin-top:20px;font-size:17px;max-width:72ch}
.control{margin-top:26px;background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-md);
         padding:22px;box-shadow:var(--shadow-1)}
.control h3{font-size:17.5px}
/* A track with a thumb that slides between three stops. The thumb is one element that moves,
   so the eye follows the setting from where it was to where it now is instead of watching one
   box light up and another go dark. */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;
     border:1px solid var(--rule);border-radius:999px;background:var(--sunk);padding:4px;isolation:isolate}
.seg::before{content:"";position:absolute;z-index:0;top:4px;bottom:4px;width:calc((100% - 8px)/3);
     inset-inline-start:4px;border-radius:999px;background:var(--ink);box-shadow:var(--shadow-1);
     transform:translateX(calc(var(--seg-i,0) * 100% * var(--seg-dir,1)));
     transition:transform .26s cubic-bezier(.32,.72,0,1)}
html[dir="rtl"] .seg{--seg-dir:-1}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:12px 8px;
     font-weight:600;font-size:15px;cursor:pointer;color:var(--muted);min-height:48px;
     border-radius:999px;transition:color .2s ease}
.seg button[aria-pressed="true"]{color:var(--paper)}
@media (prefers-reduced-motion:reduce){.seg::before{transition:none}.seg button{transition:none}}
.seg-help{font-size:14px;color:var(--muted);margin-top:11px;min-height:2.8em}
.effect{margin-top:14px;font-size:16px;padding:13px 15px;border-radius:var(--r-sm);background:var(--sunk)}
.effect.changed-now{background:var(--c-soft);border-inline-start:3px solid var(--c)}
/* The flip is the thing this page exists to teach, so it gets its own line above the result
   and a moment of movement to earn a second look. */
.flipbanner{margin-top:16px;display:none;align-items:flex-start;gap:11px;padding:14px 16px;
     border-radius:var(--r-sm);background:var(--c-soft);border:1px solid var(--c);
     font-size:16px;font-weight:600;line-height:1.45}
.flipbanner.on{display:flex;animation:flipin .34s cubic-bezier(.32,.72,0,1)}
.flipbanner .m{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:7px}
@keyframes flipin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* The card that just took the lead is worth a glance, so its border pulses once. */
.opt.just-won{animation:justwon .7s ease-out}
@keyframes justwon{0%{box-shadow:0 0 0 2px var(--win) inset,0 0 0 0 var(--win-soft)}
                   45%{box-shadow:0 0 0 2px var(--win) inset,0 0 0 12px var(--win-soft)}
                   100%{box-shadow:0 0 0 2px var(--win) inset,var(--shadow-3)}}
.opt{transition:border-color .28s ease,box-shadow .28s ease,background .28s ease}
@media (prefers-reduced-motion:reduce){
  .flipbanner.on{animation:none}.opt.just-won{animation:none}.opt{transition:none}
}
details.adv{margin-top:16px;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--raised)}
details.adv summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:15px}
details.adv .inner{padding:2px 18px 18px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.ctl label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.ctl select{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--paper);min-height:46px}

.groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:720px){.groups{grid-template-columns:1fr}}
.grp{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-md);box-shadow:var(--shadow-1)}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
     padding:18px 20px;min-height:56px;border-radius:var(--r-md)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";margin-inline-start:auto;width:9px;height:9px;flex:0 0 auto;
     border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
     transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s ease}
.grp[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.grp>summary .n{font-size:13px;font-weight:700;color:var(--muted);background:var(--sunk);
     border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.grp .grp-body{padding:0 20px 20px}
.ev-summary{font-size:15px;color:var(--muted);margin:2px 0 0}
@media (prefers-reduced-motion:reduce){.grp>summary::after{transition:none}}
.grp .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
html[dir="rtl"] .grp .k{letter-spacing:0;font-size:13px;text-transform:none}
.grp.yours .k{color:var(--b)} .grp.research .k{color:#2F5DA8} .grp.assume .k{color:var(--c)} .grp.calc .k{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grp.research .k{color:#7FA7E6}}
:root[data-theme="dark"] .grp.research .k{color:#7FA7E6}
.grp ul{list-style:none;margin:0;padding:0}
.grp li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}
.grp li:first-child{border-top:0}
.grp li>div{flex:1 1 60%;min-width:0}
.grp li .v{font-weight:600;text-align:end;flex:0 1 auto;max-width:100%;overflow-wrap:anywhere}
.grp li .s{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.grp .flag{font-size:13px;color:var(--muted);margin-top:12px}
.grp .none{font-size:14px;color:var(--muted);margin:0}

.limits{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.limits{grid-template-columns:1fr}}
.limits>div{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-md);padding:20px 22px}
.limits h3{margin-bottom:10px}
.limits ul{margin:0;padding-inline-start:20px} .limits li{margin:6px 0}

.form{background:var(--raised);border:1px solid var(--rule);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow-2)}
.fgroup{margin-top:26px} .fgroup:first-child{margin-top:0}
.fgroup .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
html[dir="rtl"] .fgroup .k{letter-spacing:0;font-size:13px;text-transform:none}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:7px;line-height:1.45}
.field .in{display:flex;align-items:center;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--paper);overflow:hidden}
.field .in:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.field .in .u{padding:0 12px;color:var(--muted);font-size:14px;min-height:48px;display:grid;place-items:center;border-inline-start:1px solid var(--rule)}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:12px;font-size:17px;min-height:48px}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px}
.btnrow{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--sunk);padding:13px 20px;border-radius:999px;font-weight:600;cursor:pointer;min-height:50px}
.btn.primary{background:var(--b);border-color:var(--b);color:#fff;font-size:16.5px;padding-inline:26px}
/* Sits above the page, never on top of it: the body reserves its height so the last section is
   still reachable, and it hides itself once the form it points at is on screen. */
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--raised);
        border-top:1px solid var(--rule);box-shadow:0 -6px 24px -12px rgba(0,0,0,.35);
        padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.sticky[hidden]{display:none}
.sticky-in{display:flex;align-items:center;gap:14px;justify-content:space-between}
.sticky-t{font-size:14.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticky .btn{min-height:46px;padding:11px 20px;font-size:15.5px}
@media (max-width:560px){.sticky-t{display:none}.sticky .btn{width:100%}}
body.has-sticky{padding-bottom:84px}
.count-note{margin:14px 0 0;font-size:13.5px;color:var(--muted)}
/* ================= the five beats =============================================================
   Each beat is one idea with air around it. The rule between beats is the only chrome. */
.beat{padding:58px 0;border-bottom:1px solid var(--rule)}
.beat:first-of-type{padding-top:34px}
.beat-t{font-family:var(--display);font-weight:600;font-size:clamp(23px,3vw,32px);
        letter-spacing:-.012em;margin:0 0 16px}
html[dir="rtl"] .beat-t{font-weight:700;letter-spacing:0;line-height:1.5}
.beat-cap{font-size:17px;font-weight:600;margin:14px 0 0;font-variant-numeric:tabular-nums}
#b-now .beat-t{margin-top:34px}
.chart-wrap.solo{margin-top:6px}

/* ================= the census =================================================================
   162 dots, three blocks, one per setting of the assumption that decides. The active block is
   the current setting; tapping a block IS setting it. */
.census{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.cblock{border:1px solid var(--rule);border-radius:var(--r-md);padding:16px 14px 13px;cursor:pointer;
        background:var(--raised);opacity:.45;text-align:start;color:inherit;font:inherit;
        transition:opacity .22s ease,border-color .22s ease,box-shadow .22s ease}
.cblock.on{opacity:1;border-color:var(--win);box-shadow:0 0 0 2px var(--win) inset}
.cblock:hover,.cblock:focus-visible{opacity:1;outline:none}
.cblock .ch{display:block;font-size:13.5px;font-weight:700;margin-bottom:11px}
.cdots{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.cdots i{display:block;aspect-ratio:1/1;border-radius:50%;background:var(--dc,var(--muted))}
.cblock .cc{display:block;margin-top:11px;font-size:13px;color:var(--muted);
            font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .census{grid-template-columns:1fr;gap:10px}
  .cdots{grid-template-columns:repeat(18,1fr)}
  .cblock{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
  .cblock .ch{margin:0}
  .cblock .cdots{grid-column:1 / -1}
  .cblock .cc{margin:0;grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){.cblock{transition:none}}

/* ================= the currency row inside the assumptions =================================== */
.curr-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px;
          padding-top:20px;border-top:1px solid var(--rule)}
.curr-row label{font-weight:600;font-size:15px}
.curr-row select{min-height:48px;border:1px solid var(--rule);border-radius:var(--r-sm);
          background:var(--paper);color:inherit;padding:0 12px;font:inherit}
.curr-row .note{margin:0;flex:1 1 100%}

/* ================= asking =====================================================================
   One question to a screen, at a size that says it is the only thing being asked. The page is
   quiet here: no navigation, no summary, nothing to read past. */
#ask{padding:38px 0 64px;max-width:620px;margin:0 auto}
body.asking .top .bizpick,body.asking .top .badge{display:none}
.askhead{display:flex;flex-direction:column;gap:10px;margin-bottom:30px}
.progress{font-size:13.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.progbar{height:4px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--win);border-radius:999px;
           transition:width .3s cubic-bezier(.32,.72,0,1)}
.askq{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.18;
      letter-spacing:-.015em;margin:0;text-wrap:balance}
html[dir="rtl"] .askq{font-weight:700;letter-spacing:0;line-height:1.5}
.askhint{color:var(--muted);margin:12px 0 0;font-size:16px}
#ask-body{margin-top:28px}
.choices{display:grid;gap:12px}
.choice{width:100%;text-align:start;border:1px solid var(--rule);background:var(--raised);
        border-radius:var(--r-md);padding:20px 22px;font:600 19px/1.35 var(--body);color:inherit;
        cursor:pointer;min-height:64px;box-shadow:var(--shadow-1);
        transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease}
html[dir="rtl"] .choice{font-size:18px}
.choice:hover,.choice:focus-visible{border-color:var(--win);outline:none;transform:translateY(-1px);
        box-shadow:var(--shadow-2)}
.choice.on{border-color:var(--win);box-shadow:0 0 0 2px var(--win) inset}
.choice.other{font-weight:500;color:var(--muted);min-height:56px;font-size:17px}
.askfields{display:grid;gap:20px}
.askfield{display:block}
.askfield .afl{display:block;font-size:16.5px;font-weight:600;margin-bottom:9px}
.askfield .in{display:flex;align-items:center;border:1px solid var(--rule);border-radius:var(--r-md);
              background:var(--raised);overflow:hidden}
.askfield .in:focus-within{border-color:var(--win);box-shadow:0 0 0 2px var(--win) inset}
.askfield input{flex:1;min-width:0;border:0;background:transparent;color:inherit;
       font:600 26px/1 var(--body);padding:18px 20px;min-height:66px;font-variant-numeric:tabular-nums}
.askfield input:focus{outline:none}
.askfield .u{padding-inline-end:20px;color:var(--muted);font-weight:600}
.otherwrap{margin-top:12px}
.askerr{color:var(--crit);font-size:15px;margin-top:14px;min-height:1.2em}
.askfoot{display:flex;gap:12px;align-items:center;margin-top:30px}
.askfoot .btn.primary{margin-inline-start:auto;min-height:56px;font-size:17px;padding-inline:32px}
.askalt{margin-top:26px}
.linkish{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;
         text-decoration:underline;text-underline-offset:3px;padding:10px 0;min-height:44px}
@media (max-width:560px){
  .askfoot{flex-wrap:wrap}
  .askfoot .btn.primary{width:100%;margin-inline-start:0;order:-1}
  .askfoot .btn:not(.primary){width:100%}
}

/* ================= the three choices ==========================================================
   Name, one figure, what you get, what you give up. */
.money-block{display:flex;flex-direction:column;gap:3px}
.money-k{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
html[dir="rtl"] .money-k{letter-spacing:0;text-transform:none;font-size:13.5px}
.trade{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--rule);padding-top:14px}
.trade p{margin:0;font-size:15.5px;line-height:1.5}
.trade .good{font-weight:600}
.trade .bad{color:var(--muted)}

/* ================= the moment ================================================================ */
.unknown-lead{font-family:var(--display);font-weight:600;font-size:clamp(19px,2.4vw,26px);
              margin:0 0 20px;line-height:1.3;text-wrap:balance}
html[dir="rtl"] .unknown-lead{font-weight:700;line-height:1.6}
#b-solid .unknown{padding:26px 24px}
#b-solid .seg{margin-top:14px}
#b-solid .seg button{font-size:16.5px;min-height:56px}
.unsure{margin-top:28px;border:1px solid var(--rule);border-radius:var(--r-md);
        padding:22px 24px;background:var(--raised)}
.unsure h3{margin:0 0 6px;font-size:19px}
.unsure p{margin:0 0 16px;color:var(--muted)}
.testplan{margin-top:18px;border-top:1px solid var(--rule);padding-top:18px}
.testplan p{color:inherit}
.readings{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.readings li{display:flex;flex-direction:column;gap:3px;background:var(--sunk);
             border-radius:var(--r-sm);padding:12px 14px}
.readings .r-n{font-weight:600;font-size:15.5px}
.readings .r-s{font-size:13.5px;color:var(--muted)}

/* ================= what is offered, not pushed ============================================== */
.reveal{border:1px solid var(--rule);border-radius:var(--r-md);background:var(--raised);
        margin-top:20px;box-shadow:var(--shadow-1)}
.reveal>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;
        padding:22px 24px;min-height:68px;flex-wrap:wrap}
.reveal>summary::-webkit-details-marker{display:none}
.reveal .rq{font-size:17.5px;font-weight:600;flex:1;min-width:0}
.reveal .rb{font-size:15px;font-weight:600;color:var(--win);border:1px solid var(--rule);
        border-radius:999px;padding:9px 16px;white-space:nowrap}
.reveal[open]>summary{border-bottom:1px solid var(--rule)}
.reveal[open] .rb{opacity:.55}
.reveal-body{padding:24px}
.sec-head.sub{margin:34px 0 14px}
.sec-head.sub h3{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.noscript{padding:24px 0;color:var(--crit);font-weight:600}
@media (max-width:560px){.reveal>summary{padding:18px}.reveal-body{padding:18px}}

/* Everything a finger is meant to land on clears the comfortable minimum, including the ones
   that are only incidentally interactive. */
.mark a{display:inline-flex;align-items:center;min-height:44px}
/* A flex row collapses the space the marker used to sit after, so the gap is stated. */
.opt details summary,.adv summary{min-height:44px;display:flex;align-items:center;gap:5px}
.field .in select{min-height:48px;width:100%;border:0;background:transparent;padding:0 12px;font:inherit;color:inherit}
.printrow{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:560px){.print-hint{display:none}}
.btn.ghost{background:transparent;min-height:44px;padding:10px 17px;font-size:14.5px}
.print-hint{font-size:13.5px;color:var(--muted)}

/* ---- printed / saved as PDF -------------------------------------------------------------
   One page that carries the decision: the verdict, the three options, the chart and where the
   numbers came from. The controls, the form and the standing call to action are interaction,
   and interaction does not print. */
@media print{
  @page{margin:14mm}
  :root{--paper:#fff;--raised:#fff;--sunk:#fff;--ink:#000;--muted:#444;--rule:#bbb;--grid:#ddd;
        --win:#000;--win-ink:#fff;--win-soft:transparent}
  body{background:#fff;color:#000;padding:0;font-size:11.5pt}
  body.has-sticky{padding-bottom:0}
  .top,.sticky,.printrow,#ask,.unsure,.adv,.langs,.bizpick,#how,.tip,
  .reveal>summary .rb{display:none !important}
  .beat{border-bottom:0}
  .reveal:not([open])>.reveal-body{display:block}   /* assumptions print even when closed */
  .cblock{opacity:1;box-shadow:none;border:1px solid #999}
  section{padding:14px 0;break-inside:avoid}
  #decision{padding-top:0}
  h1{font-size:20pt}
  h2{font-size:14pt}
  .verdict{font-size:14pt;max-width:none}
  .options{grid-template-columns:repeat(3,1fr) !important;gap:10px}
  .opt{grid-row:auto;box-shadow:none;border:1px solid #999;padding:12px}
  .opt.lead{box-shadow:none;border:2px solid #000;background:#fff}
  .lead-tag{position:static;box-shadow:none;margin-bottom:8px;display:inline-flex}
  .chart-wrap{break-inside:avoid}
  .grp{box-shadow:none;break-inside:avoid}
  .grp>summary::after{display:none}
  .grp:not([open])>.grp-body{display:block}   /* a collapsed group still prints its evidence */
  .intro-1,.intro-2,.intro-3{animation:none !important}
  a[href]::after{content:""}
}
.msg{font-size:14px;color:var(--muted)}
.errbox{border-inline-start:3px solid var(--crit);background:rgba(180,69,59,.09);padding:15px 18px;border-radius:var(--r-sm);margin-bottom:16px}
.errbox strong{display:block;margin-bottom:5px}

details.tech{border:1px solid var(--rule);border-radius:var(--r-md);background:var(--raised)}
details.tech summary{cursor:pointer;padding:16px 20px;font-weight:600}
details.tech .inner{padding:0 20px 20px;font-size:14.5px}
details.tech .inner p{max-width:76ch;margin-top:12px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--sunk);padding:2px 6px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
table.tech{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}
table.tech th,table.tech td{text-align:start;padding:7px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl-wrap{overflow-x:auto}
.foot{padding:26px 0 60px;font-size:13px;color:var(--muted)}
.banner{background:var(--crit);color:#fff;padding:14px 0;font-weight:600;display:none}
.banner.on{display:block}

/* In RTL the text flows right-to-left, but figures, the chart and the A/B/C letters do not:
   their order is arithmetic, not language, and a reversed number is a wrong number. */
html[dir="rtl"] .money,html[dir="rtl"] .rowline .v,html[dir="rtl"] .letter,
html[dir="rtl"] .mini td,html[dir="rtl"] .grp li .v,html[dir="rtl"] .field .in{direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] .mini td,html[dir="rtl"] .grp li .v{text-align:start}
</style>
</head>
<body>
<div class="banner" id="banner" role="alert"></div>

<header class="top">
  <div class="wrap">
    <div class="mark"><a href="./" id="home-link">·</a></div>
    <div class="bizpick">
      <label class="sr" for="bizsel" id="bizsel-label">business</label>
      <select id="bizsel"></select>
    </div>
    <span class="badge" id="demoflag" hidden></span>
    <div class="spacer"></div>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </div>
</header>

<main class="wrap" id="main">

  <!-- ================= the questions =================================================
       The page opens by asking, not by reporting. One question to a screen, every one of
       them an input the model actually needs — nothing is asked to make the flow feel
       longer, and nothing the model needs is guessed on the owner's behalf. -->
  <section id="ask">
    <div class="askhead">
      <span class="progress" id="ask-progress"></span>
      <div class="progbar"><i id="ask-bar"></i></div>
    </div>
    <h1 class="askq" id="ask-q"></h1>
    <p class="askhint" id="ask-hint"></p>
    <div id="ask-body"></div>
    <div id="ask-err" class="askerr" role="alert"></div>
    <div class="askfoot">
      <button type="button" class="btn" id="ask-back"></button>
      <button type="button" class="btn primary" id="ask-next"></button>
    </div>
    <p class="askalt"><button type="button" class="linkish" id="ask-example"></button>
       <button type="button" class="linkish" id="ask-restart"></button></p>
  </section>

  <!-- ================= the answer: five beats ========================================
       One idea to a screenful, in the order an owner actually thinks: what happens if I sit
       still → what could I do → watch them race → how solid is that → what do I do next.
       Everything else is behind one "show the assumptions" at the end. -->
  <div id="result" hidden>

  <section class="beat" id="b-now">
    <p class="changed"><span class="dot"></span><span id="changed-t"></span></p>
    <h1 id="headline"></h1>
    <p class="whoami" id="whoami"></p>
    <h2 class="beat-t" id="b-now-t"></h2>
    <div class="chart-wrap solo">
      <svg id="chart-now" role="img" aria-labelledby="b-now-cap"></svg>
    </div>
    <p class="beat-cap" id="b-now-cap"></p>
  </section>

  <section class="beat" id="b-options">
    <h2 class="beat-t" id="b-options-t"></h2>
    <p class="verdict intro-1" id="verdict"></p>
    <div class="options intro-2" id="options"></div>
    <div class="why"><h3 id="why-h"></h3><p id="why-p"></p></div>
    <p class="scenario" id="scenario"></p>
  </section>

  <section class="beat" id="b-race">
    <h2 class="beat-t" id="b-race-t"></h2>
    <p class="lede" id="chart-lede"></p>
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 960 380" role="img" aria-labelledby="chart-alt"></svg>
      <p class="sr" id="chart-alt"></p>
      <div class="tip" id="tip"></div>
      <div class="legend" id="legend"></div>
    </div>
    <p class="note" id="cash-note"></p>
  </section>

  <section class="beat" id="b-solid">
    <p class="unknown-lead" id="unknown-lead"></p>
    <div class="unknown">
      <h2 id="unknown-title"></h2>
      <div class="seg" id="seg" role="group" aria-labelledby="unknown-title"></div>
      <div class="seg-help" id="seg-help"></div>
      <p class="flipbanner" id="flipbanner" role="status" aria-live="assertive"><span class="m"></span><span id="flipbanner-t"></span></p>
      <div class="effect" id="effect" role="status" aria-live="polite"></div>
      <!-- The census, visible: every tested case is a dot, coloured by its winner. The flip
           stops being a sentence and becomes structure you can see. -->
      <div class="census" id="census"></div>
      <p class="count-note" id="count-note"></p>
    </div>
  </section>

  <section class="beat" id="b-monday">
    <h2 class="beat-t" id="b-monday-t"></h2>
    <div class="unsure">
      <h3 id="unsure-q"></h3>
      <p id="unsure-lead"></p>
      <button type="button" class="btn" id="uk-try"></button>
      <div class="testplan" id="testplan" hidden>
        <p id="test-what"></p>
        <div class="k" id="test-reading"></div>
        <ul class="readings" id="test-readings"></ul>
      </div>
    </div>
  </section>

  <details class="reveal" id="assume-disc">
    <summary><span class="rq" id="assume-reveal-q"></span><span class="rb" id="assume-reveal-btn"></span></summary>
    <div class="reveal-body">
      <div class="groups" id="groups"></div>
      <div class="mini"><table id="mini"></table></div>

      <div class="sec-head sub"><h3 id="change-title"></h3></div>
      <ul class="influence" id="influence"></ul>
      <p class="flipline" id="flipline"></p>
      <details class="adv"><summary id="adv-sum"></summary><div class="inner"><div class="controls" id="controls"></div></div></details>

      <div class="sec-head sub"><h3 id="limits-title"></h3></div>
      <div class="limits">
        <div><h4 id="does-h"></h4><ul id="does"></ul></div>
        <div><h4 id="doesnot-h"></h4><ul id="doesnot"></ul></div>
      </div>

      <div class="curr-row"><label for="cursel" id="curr-l"></label>
        <select id="cursel"></select><span class="note" id="currency-note"></span></div>

      <details class="tech" id="how"><summary id="how-open"></summary><div class="inner" id="how-body"></div></details>
      <p class="printrow"><button class="btn ghost" id="printbtn"></button>
         <span class="print-hint" id="print-hint"></span></p>

/* The explanation comes from this run's own figures, so a different winner explains itself. */
function whyText(out, rank, cap){
  var lead = rank[0], second = rank[1], SHORT = w('world_short'), m = out[lead].m, parts = [];
  /* The second clause continues the first, so it has to know what the first one said. When
     demand is not falling there is no loss to answer, and "but ... makes up for it" would be
     answering a sentence nobody wrote. */
  var full = cap && m.util_end !== undefined && m.util_end > 99;
  if(m.orders_change < -0.05){
    parts.push(fill(t('why_lose_units'), {pct: num(Math.abs(m.orders_change)) + PS(), unit: w('unit_word')}));
    if(full) parts.push(t('why_gain_capacity'));
    else if(out[lead].m.mnet > out.A.m.mnet && lead === 'B') parts.push(t('why_gain'));
    else parts.push(fill(t('why_cost'), {cost: w('cost_word')}));
  } else {
    parts.push(m.orders_change > 0.05 ? t('why_demand_grows') : t('why_demand_holds'));
    if(full) parts.push(t('why_capacity_full'));
    else if(lead === 'B') parts.push(t('why_price_through'));
    else parts.push(fill(t('why_cost'), {cost: w('cost_word')}));
  }
  if(lead !== 'A') parts.push(fill(t('why_vs_a'),
    {other: SHORT.A, amount: money(out[lead].m.cash90 - out.A.m.cash90)}));
  parts.push(fill(t('why_gap'), {lead: SHORT[lead], second: SHORT[second],
    amount: money(out[lead].m.cash90 - out[second].m.cash90)}));
  return parts.join(' ');
}

/* The day the modelled event begins, read off the scenario rather than assumed. */
function shockStart(){
  try {
    var evs = D.reproducibility.worlds[0].spec.events || [];
    if(!evs.length) return null;
    var d = evs[0].start_turn;
    return (typeof d === 'number' && isFinite(d)) ? d : null;
  } catch(e){ return null; }
}

/* The day a cash curve stops rising and starts giving it back, or null if it never does.
   A curve that drifts down by a rounding error has not turned over, so the fall has to be
   worth naming before the chart names it. */
function turnDay(cash){
  var best = 0;
  for(var i=1;i<=H;i++) if(cash[i] > cash[best]) best = i;
  if(best === 0 || best >= H) return null;
  var fall = cash[best] - cash[H];
  if(fall < Math.abs(cash[best]) * 0.005) return null;
  return best;
}

/* Axis figures carry a short symbol but not a word — see the caption for the word. */
function axisMoney(v){
  return curIsWord() ? (v<0?'−':'') + NF.format(Math.abs(Math.round(v))) : money(v);
}

/* "If you do nothing", on its own. One line, drawn at the size it is seen at, annotated
   from its own trajectory: where the increase lands, where holding still stops paying, and
   where it ends up. For a business whose problem is a full diary, the marker is the day the
   diary fills instead. Nothing here is computed — it is the ledger the engine already made,
   read out loud. */
function drawSolo(out){
  var svg = document.getElementById('chart-now');
  var own = svg.getBoundingClientRect().width;
  var W = Math.round(own || svg.parentElement.getBoundingClientRect().width || 0);
  if(W < 100) W = 960;                    // hidden or unlaid-out: draw for the common case
  W = Math.max(300, W);
  var narrow = W < 560;
  var Hh = narrow ? 240 : 300, pl = narrow ? 54 : 70, pr = 18, pt = 26, pb = 34;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
  svg.dataset.w = W;
  var c = out.A.L.cash, mn = Math.min.apply(null, c.slice(0, H + 1)),
      mx = Math.max.apply(null, c.slice(0, H + 1));
  var lo = Math.min(mn, c[0]), hi = Math.max(mx, c[0]);
  var step = niceStep(Math.max(1, hi - lo), 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if(hi === lo) hi = lo + step;
  function x(d){ return pl + d * (W - pl - pr) / H; }
  function y(v){ return pt + (hi - v) * (Hh - pt - pb) / (hi - lo); }
  var m = '';
  for(var v = lo; v <= hi + 1e-9; v += step)
    m += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v)
       + '" stroke="var(--grid)"/>'
       + '<text x="' + (pl - 9) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="12"'
       + ' fill="var(--muted)" direction="ltr">' + axisMoney(v) + '</text>';
  (narrow ? [0, 45, 90] : [0, 30, 60, 90]).forEach(function(d){
    var anchor = d === 0 ? 'start' : (d === H ? 'end' : 'middle');
    m += '<text x="' + x(d) + '" y="' + (Hh - 8) + '" text-anchor="' + anchor
       + '" font-size="12" fill="var(--muted)">' + t('day', {n: num(d)}) + '</text>'; });
  var path = 'M' + x(0) + ',' + y(c[0]);
  for(var d = 1; d <= H; d++) path += ' L' + x(d) + ',' + y(c[d]);
  m += '<path d="' + path + ' L' + x(H) + ',' + y(lo) + ' L' + x(0) + ',' + y(lo)
     + ' Z" fill="var(--a)" opacity=".08"/>'
     + '<path d="' + path + '" fill="none" stroke="var(--a)" stroke-width="3"'
     + ' stroke-linejoin="round" stroke-linecap="round"/>';
  var shockDay = shockStart();
  if(shockDay !== null && shockDay >= 0 && shockDay < H){
    var sl = t('chart_shock');
    m += '<line x1="' + x(shockDay) + '" x2="' + x(shockDay) + '" y1="' + pt + '" y2="' + (Hh - pb)
       + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>';
    if(x(shockDay) + 6 + sl.length * 6 <= W - pr)
      m += '<text x="' + (x(shockDay) + 6) + '" y="' + (pt - 8 < 10 ? pt + 12 : pt - 8)
         + '" font-size="12" fill="var(--muted)">' + esc(sl) + '</text>';
  }
  var turn = turnDay(c);
  if(turn !== null){
    var label = w('chart_turn'), tx = x(turn), ty = y(c[turn]);
    var est = label.length * 6.3, anchor = 'start', at = tx + 8;
    if(at + est > W - pr){ anchor = 'end'; at = tx - 8; }
    var fits = (anchor === 'start') ? (at + est <= W - pr) : (at - est >= pl);
    m += '<circle cx="' + tx + '" cy="' + ty + '" r="4.5" fill="none" stroke="var(--a)"'
       + ' stroke-width="2"/>';
    if(fits)
      m += '<text x="' + at + '" y="' + (ty - 12) + '" font-size="12.5" fill="var(--a)"'
         + ' text-anchor="' + anchor + '">' + esc(label) + '</text>';
  }
  // A diary that fills up is this wedge's version of "doing nothing stops working".
  if(out.A.L.util && out.A.L.util.length){
    for(var sd = 1; sd <= H; sd++) if(out.A.L.util[sd] >= 99.5){
      m += '<circle cx="' + x(sd) + '" cy="' + y(c[sd]) + '" r="4.5" fill="none"'
         + ' stroke="var(--c)" stroke-width="2"/>';
      break;
    }
  }
  m += '<circle cx="' + x(H) + '" cy="' + y(c[H]) + '" r="4" fill="var(--a)"/>'
     + '<text x="' + (x(H) - 8) + '" y="' + (y(c[H]) - 10) + '" font-size="13" font-weight="600"'
     + ' fill="var(--a)" text-anchor="end" direction="ltr">' + money(c[H]) + '</text>';
  svg.innerHTML = m;
}

function drawChart(out, lead){
  var svg = document.getElementById('chart');
  // The svg's own width, so one unit in the drawing is one pixel on the glass and a 12px
  // label is 12px. Falls back to the wrapper before first layout.
  var own = svg.getBoundingClientRect().width;
  var W = Math.round(own || svg.parentElement.getBoundingClientRect().width || 0);
  if(W < 100) W = 960;                    // hidden or unlaid-out: draw for the common case
  W = Math.max(300, W);
  var narrow = W < 560;
  var Hh = narrow ? 300 : 380;
  svg.dataset.w = W;
  // On a narrow chart the right margin held the end-of-line figures. They move to the table
  // directly below rather than being squeezed into a margin that is no longer there.
  var pl = narrow ? 54 : 74, pr = narrow ? 16 : 104, pt = narrow ? 30 : 24, pb = 38;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
  var all = []; WID.forEach(function(id){ all = all.concat(out[id].L.cash.slice(0,H+1)); });
  var mn = Math.min.apply(null,all), mx = Math.max.apply(null,all);
  var lo = (mn < 0.25*mx) ? Math.min(0, mn) : mn, hi = mx;
  var step = niceStep(hi-lo, 4);
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step; if(hi===lo) hi = lo+step;
  function x(d){ return pl + d*(W-pl-pr)/H; }
  function y(v){ return pt + (hi-v)*(Hh-pt-pb)/(hi-lo); }
  var s = '';
  for(var v=lo; v<=hi+1e-9; v+=step)
    s += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)"/>'
       + '<text x="'+(pl-9)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)"'
       + ' direction="ltr">'+axisMoney(v)+'</text>';
  var axisCap = t('chart_axis_unit') + (cur ? ' · ' + cur : '');
  s += '<text x="'+(pl-44>0?pl-44:2)+'" y="'+(pt-10)+'" font-size="11.5" fill="var(--muted)"'
     + ' letter-spacing=".06em">'+esc(axisCap)+'</text>';
  (narrow ? [0,45,90] : [0,30,60,90]).forEach(function(d){
    var anchor = d === 0 ? 'start' : (d === H ? 'end' : 'middle');
    s += '<text x="'+x(d)+'" y="'+(Hh-10)+'" text-anchor="'+anchor+'" font-size="12" fill="var(--muted)">'
       + t('day',{n:num(d)}) + '</text>'; });
  if(lo<=0 && hi>0)
    s += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="4 4"/>'
       + '<text x="'+(W-pr+7)+'" y="'+(y(0)+4)+'" font-size="12" fill="var(--crit)">'+t('cash_zero')+'</text>';
  var bl = out[lead].L.cash, area = 'M'+x(0)+','+y(bl[0]);
  for(var d1=1; d1<=H; d1++) area += ' L'+x(d1)+','+y(bl[d1]);
  area += ' L'+x(H)+','+y(lo)+' L'+x(0)+','+y(lo)+' Z';
  s += '<path d="'+area+'" fill="var(--'+lead.toLowerCase()+')" opacity=".08"/>';
  var ends = WID.map(function(id){ return {id:id, ty:y(out[id].L.cash[H])}; })
                .sort(function(a,b){ return a.ty-b.ty; });
  for(var i=1;i<ends.length;i++) if(ends[i].ty-ends[i-1].ty < 17) ends[i].ty = ends[i-1].ty + 17;
  WID.forEach(function(id){
    var c = out[id].L.cash, p = 'M'+x(0)+','+y(c[0]);
    for(var d2=1; d2<=H; d2++) p += ' L'+x(d2)+','+y(c[d2]);
    s += '<path d="'+p+'" fill="none" stroke="var(--'+id.toLowerCase()+')" stroke-width="'+(id===lead?3.5:2)
       + '" stroke-linejoin="round" stroke-linecap="round"/>';
    var e = ends.filter(function(z){ return z.id===id; })[0];
    s += '<circle cx="'+x(H)+'" cy="'+y(c[H])+'" r="4" fill="var(--'+id.toLowerCase()+')"/>';
    if(!narrow)
      s += '<text x="'+(x(H)+8)+'" y="'+(e.ty+4)+'" font-size="13" font-weight="600" fill="var(--'
         + id.toLowerCase()+')" direction="ltr">'+id+' '+money(c[H])+'</text>';
  });
  s += '<circle cx="'+x(0)+'" cy="'+y(out.A.L.cash[0])+'" r="3.5" fill="var(--ink)"/>'
     + '<text x="'+x(0)+'" y="'+(y(out.A.L.cash[0])+20)+'" font-size="12" fill="var(--muted)">'
     + t('chart_today')+' '+money(out.A.L.cash[0])+'</text>';

  /* Where the increase lands. It is day one here, so the rule is drawn thin and labelled at the
     top, clear of the "today" figure sitting on the axis. */
  var shockDay = shockStart();
  if(shockDay !== null && shockDay >= 0 && shockDay < H){
    var sl = t('chart_shock');
    s += '<line x1="'+x(shockDay)+'" x2="'+x(shockDay)+'" y1="'+pt+'" y2="'+(Hh-pb)
       + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>';
    if(x(shockDay) + 6 + sl.length * 6 <= W - pr)
      s += '<text x="'+(x(shockDay)+6)+'" y="'+(pt-14 < 0 ? pt+12 : pt-14)+'" font-size="12"'
         + ' fill="var(--muted)">' + esc(sl) + '</text>';
  }

  /* Where doing nothing stops working: the day A's cash peaks before falling away. Taken from
     the trajectory itself, so it is only drawn when the curve really does turn over — a wedge
     whose A never declines gets no annotation rather than a made-up one. */
  /* The day the leader pulls away from doing nothing. Everything starts from the same cash,
     so the day the gap first becomes real is the day the decision starts paying. */
  if(lead !== 'A'){
    var la = out.lead === undefined ? out[lead].L.cash : out[lead].L.cash, aa = out.A.L.cash;
    var thr = Math.max(1, Math.abs(aa[0]) * 0.005), od = null, wasBehind = false;
    for(var dd = 1; dd <= H; dd++){
      if(la[dd] < aa[dd] - thr) wasBehind = true;
      else if(wasBehind && la[dd] - aa[dd] > thr){ od = dd; break; }
    }
    // Only a real crossover is worth a label: the leader fell behind first (lost orders bite
    // before the higher price pays) and then came back past. A line that led from day one
    // has no overtaking day, and saying "from day 2" would be noise dressed as insight.
    if(od !== null){
      var ol = fill(t('overtake'), {d: num(od), b: w('world_short')[lead], a: w('world_short').A});
      var oy = y(out[lead].L.cash[od]);
      s += '<circle cx="' + x(od) + '" cy="' + oy + '" r="4.5" fill="none"'
         + ' stroke="var(--' + lead.toLowerCase() + ')" stroke-width="2"/>';
      var oEst = ol.length * 6.3, oAnchor = 'start', oAt = x(od) + 8;
      if(oAt + oEst > W - pr){ oAnchor = 'end'; oAt = x(od) - 8; }
      if((oAnchor === 'start' ? oAt + oEst <= W - pr : oAt - oEst >= pl))
        s += '<text x="' + oAt + '" y="' + (oy + 22) + '" font-size="12.5"'
           + ' fill="var(--' + lead.toLowerCase() + ')" text-anchor="' + oAnchor + '">'
           + esc(ol) + '</text>';
    }
  }

  var turn = turnDay(out.A.L.cash);
  if(turn !== null){
    var tx = x(turn), ty = y(out.A.L.cash[turn]);
    var label = w('chart_turn');
    // No text metrics inside an SVG string, so the width is estimated and the label is placed
    // on whichever side it fits — and if it fits on neither, it is not drawn at all rather
    // than drawn off the edge.
    var est = label.length * 6.3, x0 = pl, x1 = W - pr;
    var anchor = 'start', at = tx + 8;
    if(at + est > x1){ anchor = 'end'; at = tx - 8; }
    var fits = (anchor === 'start') ? (at + est <= x1) : (at - est >= x0);
    s += '<circle cx="'+tx+'" cy="'+ty+'" r="4.5" fill="none" stroke="var(--a)" stroke-width="2"/>'
       + '<line x1="'+tx+'" x2="'+tx+'" y1="'+(ty-9)+'" y2="'+(ty-26)+'" stroke="var(--a)" stroke-width="1"/>';
    if(fits)
      s += '<text x="'+at+'" y="'+(ty-30)+'" font-size="12.5" fill="var(--a)" text-anchor="'+anchor+'">'
         + esc(label) + '</text>';
  }
  s += '<g id="hover" style="display:none"><line id="hl" y1="'+pt+'" y2="'+(Hh-pb)
     + '" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3"/>'
     + WID.map(function(id){ return '<circle id="hc'+id+'" r="4.5" fill="var(--'+id.toLowerCase()
         +')" stroke="var(--raised)" stroke-width="2"/>'; }).join('') + '</g>';
  svg.innerHTML = s;

  var tip = document.getElementById('tip'), hov = svg.querySelector('#hover'), SHORT = w('world_short');
  function show(ev){
    var rect = svg.getBoundingClientRect(); if(!rect.width) return;
    var px = (ev.clientX - rect.left) * (W / rect.width);
    var d = Math.max(0, Math.min(H, Math.round((px - pl) * H / (W - pl - pr))));
    if(px < pl-10 || px > W-pr+10){ hide(); return; }
    hov.style.display = '';
    svg.querySelector('#hl').setAttribute('x1', x(d)); svg.querySelector('#hl').setAttribute('x2', x(d));
    WID.forEach(function(id){ var c = svg.querySelector('#hc'+id);
      c.setAttribute('cx', x(d)); c.setAttribute('cy', y(out[id].L.cash[d])); });
    tip.innerHTML = '<b>'+t('day',{n:num(d)})+'</b>' + WID.map(function(id){
      return '<span><span>'+id+' · '+esc(SHORT[id])+'</span><span>'+money(out[id].L.cash[d])+'</span></span>';
    }).join('');
    tip.style.display = 'block';
    var wr = svg.parentElement.getBoundingClientRect();
    var left = ev.clientX - wr.left + 14; if(left + 200 > wr.width) left = ev.clientX - wr.left - 210;
    tip.style.left = Math.max(8,left)+'px'; tip.style.top = Math.max(8, ev.clientY - wr.top - 72)+'px';
  }
  function hide(){ hov.style.display = 'none'; tip.style.display = 'none'; }
  svg.onpointermove = show; svg.onpointerdown = show; svg.onpointerleave = hide;
}

  D.assumptions.filter(function(a){ return a.klass === 'Assumption'; }).slice(0,3)
    .forEach(function(a){ assume.push([assumptionLabel(a), assumptionValue(a)]); });
  var calc = [[t('row_net'), signed(out[cTop] ? out[cTop].m.mnet : out.A.m.mnet)],
              [t('row_cash_90'), money(out[cTop] ? out[cTop].m.cash90 : out.A.m.cash90)]];

  function li(rows){ return rows.map(function(r){
    return '<li><div><span>' + esc(r[0]) + '</span>'
      + (r[2] ? '<span class="s">' + esc(r[2]) + '</span>' : '')
      + '</div><span class="v">' + esc(String(r[1])) + '</span></li>'; }).join(''); }
  var none = (C.research_settings || []).length ? t('no_research') : t('no_research_ever');

  /* Where the numbers come from, countable before it is readable. On a phone the four groups
     are a long scroll, so each one opens on demand; on a wide screen there is room to leave
     them open and they stay open. Either way every row is in the page. */
  var openByDefault = window.matchMedia && window.matchMedia('(min-width: 861px)').matches;
  function grp(cls, key, rows, body, count){
    return '<details class="grp ' + cls + '"' + (openByDefault ? ' open' : '') + '>'
      + '<summary><span class="k">' + esc(t(key)) + '</span>'
      + '<span class="n">' + esc(num(count)) + '</span></summary>'
      + '<div class="grp-body">' + (rows !== null ? '<ul>' + li(rows) + '</ul>' : '') + (body || '') + '</div>'
      + '</details>';
  }
  document.getElementById('groups').innerHTML =
      grp('yours', 'group_yours', yours, '', yours.length)
    + grp('research', 'group_research', research.length ? research : null,
          research.length ? '' : '<p class="none">' + esc(none) + '</p>', research.length)
    + grp('assume', 'group_assumptions', assume,
          '<div class="flag">' + esc(w('sources_note')) + '</div>', assume.length)
    + grp('calc', 'group_calculated', calc,
          '<div class="flag">' + esc(t('cash_derived')) + '</div>', calc.length);

}

function renderAdvanced(){
  var c = document.getElementById('controls'); c.innerHTML = '';
  GRID_KEYS.filter(function(k){ return k !== PRIMARY && k !== SHOCK_KEY; }).forEach(function(k){
    var d = document.createElement('div'); d.className = 'ctl';
    d.innerHTML = '<label for="c_'+k+'">' + esc(axisLabel(k)) + '</label>'
      + '<select id="c_'+k+'" data-k="'+k+'">' + GRID_VALS[k].map(function(o){
          return '<option value="'+o+'"' + (String(o)===String(sel[k]) ? ' selected' : '') + '>'
               + esc(settingLabel(k, o)) + '</option>'; }).join('') + '</select>';
    c.appendChild(d);
  });
}

/* One set of rules about what makes a usable baseline, used by the flow and by the full form
   so the two can never disagree about which numbers the page will accept. */
function validate(nb){
  var errs = [], IF = w('intake'), sepc = (lang === 'fa') ? '، ' : ', ';
  var zero = [];
  [F.revenue, F.units_per_day, F.unit_cost_total].forEach(function(k){
    if(!(nb[k] > 0)) zero.push((IF[k] && IF[k].label) || k); });
  if(zero.length) errs.push(fill(t('err_positive'), {names: zero.join(sepc)}));
  else if(nb[F.unit_cost_total] >= nb[F.revenue]) errs.push(t('err_cost_high'));
  if(F.utilisation && !(nb[F.utilisation] > 0 && nb[F.utilisation] <= 100)) errs.push(t('err_utilisation'));
  if(nb[F.fixed] < 0 || nb[F.cash] < 0)
    errs.push(fill(t('err_positive'), {names: (IF[F.fixed] && IF[F.fixed].label) || F.fixed}));
  return errs;
}

function renderHow(){
  var R = D.reproducibility;
  var ladder = D.assumptions.map(function(a){
    var kl = L.ui.klass_labels || {};
    return '<tr><td>' + esc(assumptionLabel(a)) + '</td><td>' + esc(assumptionValue(a))
      + '</td><td>' + esc(kl[a.klass] || a.klass)
      + '</td><td><code>' + esc(a.ladder_status) + '</code></td></tr>'; }).join('');
  document.getElementById('how-body').innerHTML =
      '<p>' + esc(t('cash_derived')) + '</p>'
    + '<p><code>' + esc(R.module_id) + '</code> · <code>' + R.module_semantic_hash.slice(0,16) + '</code> · <code>'
    + R.shared_fingerprint.slice(0,16) + '</code> · '
    + R.worlds.map(function(x){
        /* Both fingerprints: the engine one moves when the build does, the trajectory one
           does not, so together they say whether a rerun differed in code or in result. */
        return x.spec.id + ' <code>' + x.engine_fingerprint.slice(0,12) + '</code>/<code>'
             + x.trajectory_fingerprint.slice(0,12) + '</code>'; }).join(' · ')
    + '</p><p>' + num(D.sensitivity.n) + ' — '
    + esc(GRID_KEYS.map(axisLabel).join('; ')) + '</p>'
    + '<p>' + D.sources.map(function(s){
        return esc(s.citation) + ' — ' + esc(s.estimate) + '. ' + esc(s.transfer); }).join('<br><br>')
    + '</p><div class="tbl-wrap"><table class="tech"><tbody>' + ladder + '</tbody></table></div>';
}

/* ---- switching: language and business, both presentation only ---------------------------- */
function applyLanguage(code, push){
  lang = code; L = I.strings[lang]; setFormatters();
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  try { localStorage.setItem('dc_lang', lang); } catch(e){}
  document.getElementById('langs').innerHTML = I.languages.map(function(l){
    return '<button type="button" data-l="' + l.code + '" lang="' + l.code + '" aria-pressed="'
      + (l.code === lang) + '">' + esc(l.label) + '</button>'; }).join('');
  renderBiz();
  if(push){ var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null,'',u); }
  render(true);
}
function renderBiz(){
  var s = document.getElementById('bizsel'), here = D.wedge.id, all = L.all_wedges;
  s.innerHTML = Object.keys(all).map(function(id){
    return '<option value="'+id+'"' + (id===here ? ' selected' : '') + '>'
      + esc(all[id].icon + '  ' + all[id].business_short) + '</option>'; }).join('');
  s.onchange = function(){
    var u = new URL(location.href);
    if(u.searchParams.has('w')){
      u.searchParams.set('w', s.value); u.searchParams.set('lang', lang); location.href = u.toString();
    } else {
      location.href = '../' + s.value + '/' + s.value + '_decision_report.html?lang=' + lang;
    }
  };
}
document.getElementById('langs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(b) applyLanguage(b.dataset.l, true); });
/* A census block and the control above it are the same dial. */
document.getElementById('census').addEventListener('click', function(e){
  var b = e.target.closest('.cblock'); if(!b) return;
  sel[PRIMARY] = b.dataset.v;
  render();
});
document.getElementById('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return; sel[PRIMARY] = b.dataset.v; render(); });
document.getElementById('controls').addEventListener('change', function(e){
  var k = e.target.dataset.k; if(!k) return;
  var v = e.target.value; sel[k] = isNaN(parseFloat(v)) ? v : parseFloat(v); render(); });

/* A render that dies part-way is the dangerous kind of failure: the top of the page shows the
   new figures while the bottom still describes the previous ones, and nothing looks wrong. The
   page would rather say it is broken than quietly show a customer someone else's numbers. */
(function guardRender(){
  var inner = render;
  render = function(langChanged){
    try { inner(langChanged); }
    catch(err){
      // fail() raises its own error to stop the page, so the original cause is logged
      // first — otherwise the only thing left is the message shown to the reader.
      if(window.console && console.error) console.error('render failed:', err);
      fail(t('render_failed'));
    }
  };
})();

/* The offer to use your own figures follows the reader, and steps aside once the form is on
   screen so it never sits on top of the thing it is pointing at. */
document.getElementById('printbtn').addEventListener('click', function(){
  /* The print rules below decide what survives; nothing is rebuilt for the printer, so what
     comes out is the page the reader was looking at. */
  window.print();
});

(function stickyCta(){
  var bar = document.getElementById('sticky'), go = document.getElementById('sticky-go');
  var cards = document.getElementById('options');
  go.addEventListener('click', function(){
    // Back into the questions, with the previous answers still filled in.
    showScreen('ask');
    askAt = 0;
    renderAsk();
    window.scrollTo({top: 0, behavior: motionOK() ? 'smooth' : 'auto'});
  });
  var shown = null;
  function update(){
    var want = showing === 'result' && cards.getBoundingClientRect().bottom < 0;
    if(want === shown) return;
    shown = want;
    bar.hidden = !want;
    document.body.classList.toggle('has-sticky', want);
  }
  var queued = false;
  function onScroll(){
    if(queued) return;
    queued = true;
    requestAnimationFrame(function(){ queued = false; update(); });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  update();
  window.__stickyUpdate = update;      // so the state can be checked without a real scroll

  /* The charts are drawn for one width, so a changed width needs a redraw — and "changed"
     includes gaining a width at all: a tab opened in the background lays out at zero and
     only later becomes real. Resize covers the first case; the observer covers the second. */
  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ if(showing === 'result') render(true); }, 160);
  });
  if('IntersectionObserver' in window){
    var watch = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting || showing !== 'result') return;
        var el = en.target, wNow = Math.round(el.getBoundingClientRect().width);
        if(wNow > 100 && Math.abs(wNow - (parseInt(el.dataset.w, 10) || 0)) > 40) render(true);
      });
    }, {threshold: 0.05});
    watch.observe(document.getElementById('chart'));
    watch.observe(document.getElementById('chart-now'));
  }
})();


/* ---- the question flow ---------------------------------------------------------------------
   The owner answers a few questions and then gets an answer. Every question here is an input
   the model needs; the flow does not invent one to seem thorough, and does not skip one and
   guess it. `base` is only written once, at the end, so a half-finished flow can never leave
   the page showing a comparison of half-entered figures. */
var FLOW = (C.flow || []).slice();
var askAt = 0;
var draft = Object.assign({}, D.baseline_raw);
var answered = {};                       // fields the owner has actually filled in
var showing = 'ask';

function stepQ(step){ return (w('flow_q') || {})[step.key] || ''; }
function stepChoices(step){ return (w('flow_choices') || {})[step.key] || null; }

function showScreen(which){
  showing = which;
  document.getElementById('ask').hidden = (which !== 'ask');
  document.getElementById('result').hidden = (which !== 'result');
  document.body.classList.toggle('asking', which === 'ask');
  if(window.__stickyUpdate) window.__stickyUpdate();
}

function renderAsk(){
  if(!FLOW.length){ finishAsk(true); return; }
  var step = FLOW[askAt], IF = w('intake'), body = document.getElementById('ask-body');
  document.getElementById('ask-progress').textContent =
      fill(t('flow_step_of'), {n: num(askAt + 1), total: num(FLOW.length)});
  document.getElementById('ask-bar').style.width = ((askAt + 1) / FLOW.length * 100) + '%';
  document.getElementById('ask-q').textContent = stepQ(step);
  document.getElementById('ask-err').textContent = '';

  var choices = stepChoices(step);
  var hint = '';
  if(choices){
    var f = step.fields[0];
    body.innerHTML = '<div class="choices">' + Object.keys(choices).map(function(v){
        var on = String(draft[f]) === String(v);
        return '<button type="button" class="choice' + (on ? ' on' : '') + '" data-f="' + esc(f)
             + '" data-v="' + esc(v) + '">' + esc(choices[v]) + '</button>'; }).join('')
      + (step.other ? '<button type="button" class="choice other" data-other="' + esc(f) + '">'
           + esc(t('flow_other')) + '</button>' : '')
      + '</div><div class="otherwrap" id="otherwrap" hidden></div>';
  } else {
    body.innerHTML = '<div class="askfields">' + step.fields.map(function(f){
        var meta = IF[f] || {}, isPct = /_pct$/.test(f);
        hint = hint || meta.hint || '';
        return '<label class="askfield"><span class="afl">' + esc(meta.label || f) + '</span>'
          + '<span class="in"><input id="a_' + f + '" data-k="' + f + '" type="number"'
          + ' inputmode="decimal" step="any" value="'
          + (answered[f] ? esc(String(draft[f])) : '') + '"'
          + ' placeholder="' + esc(String(D.baseline_raw[f])) + '">'
          + (isPct ? '<span class="u">' + PS() + '</span>' : '') + '</span></label>';
      }).join('') + '</div>';
  }
  document.getElementById('ask-hint').textContent = choices ? '' : (hint || t('flow_approx'));
  document.getElementById('ask-back').textContent = t('flow_back');
  document.getElementById('ask-back').style.visibility = askAt === 0 ? 'hidden' : '';
  document.getElementById('ask-next').textContent =
      askAt === FLOW.length - 1 ? t('flow_see') : t('flow_next');
  document.getElementById('ask-example').textContent = t('flow_example');
  document.getElementById('ask-restart').textContent = t('start_over');
  var first = body.querySelector('input');
  if(first && motionOK()) setTimeout(function(){ first.focus(); }, 60);
}

/* Reading a screen's answers into the draft. Returns the label of anything unreadable, so the
   flow can say which figure it could not use rather than refusing as a whole. */
function readStep(){
  var step = FLOW[askAt], IF = w('intake'), bad = [];
  Array.prototype.forEach.call(document.querySelectorAll('#ask-body input[data-k]'), function(i){
    var k = i.dataset.k;
    var raw = String(i.value).replace(/[,\s٬،]/g, '')
      .replace(/[۰-۹]/g, function(ch){ return String(ch.charCodeAt(0) - 0x06F0); })
      .replace(/[٠-٩]/g, function(ch){ return String(ch.charCodeAt(0) - 0x0660); });
    var v = parseFloat(raw);
    if(!isFinite(v) || v < 0) bad.push((IF[k] && IF[k].label) || k);
    else { draft[k] = v; answered[k] = true; }
  });
  return bad;
}

var STORE_KEY = 'dc_ans_' + D.wedge.id;
function finishAsk(isDemo){
  draft.is_demo = !!isDemo;
  if(!isDemo) draft.name = '';           // these are your figures, not the fictional cafe's
  if(!isDemo){
    // A tool remembers. Only the answers travel — never the demo's stand-ins.
    try {
      var keep = {};
      FLOW.forEach(function(st){ st.fields.forEach(function(f){ keep[f] = draft[f]; }); });
      localStorage.setItem(STORE_KEY, JSON.stringify(keep));
    } catch(e){}
  }
  base = draft;
  render();
  showScreen('result');
  window.scrollTo({top: 0, behavior: motionOK() ? 'smooth' : 'auto'});
}

document.getElementById('ask-body').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.other !== undefined){
    var wrap = document.getElementById('otherwrap');
    wrap.hidden = false;
    wrap.innerHTML = '<label class="askfield"><span class="in"><input id="a_' + b.dataset.other
      + '" data-k="' + b.dataset.other + '" type="number" inputmode="decimal" step="any"'
      + ' placeholder="' + esc(String(D.baseline_raw[b.dataset.other])) + '"'
      + ' value=""><span class="u">' + PS() + '</span></span></label>';
    Array.prototype.forEach.call(document.querySelectorAll('#ask-body .choice'),
      function(c){ c.classList.remove('on'); });
    b.classList.add('on');
    wrap.querySelector('input').focus();
    return;
  }
  if(b.dataset.f === undefined) return;
  draft[b.dataset.f] = parseFloat(b.dataset.v);
  answered[b.dataset.f] = true;
  Array.prototype.forEach.call(document.querySelectorAll('#ask-body .choice'),
    function(c){ c.classList.toggle('on', c === b); });
  var wrap2 = document.getElementById('otherwrap');
  if(wrap2){ wrap2.hidden = true; wrap2.innerHTML = ''; }
  // A tapped choice is an answer; carrying straight on is what the reader expects.
  setTimeout(nextStep, 140);
});

document.getElementById('ask-body').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); nextStep(); }
});

function nextStep(){
  var bad = readStep();
  if(bad.length){
    document.getElementById('ask-err').textContent =
      fill(t('err_positive'), {names: bad.join(lang === 'fa' ? '، ' : ', ')});
    return;
  }
  if(askAt < FLOW.length - 1){ askAt++; renderAsk(); }
  else {
    // The same validation the full form applies, so the flow cannot produce a baseline the
    // rest of the page would refuse.
    var errs = validate(draft);
    if(errs.length){ document.getElementById('ask-err').textContent = errs[0]; return; }
    finishAsk(false);
  }
}

document.getElementById('ask-next').addEventListener('click', nextStep);
document.getElementById('ask-back').addEventListener('click', function(){
  readStep();
  if(askAt > 0){ askAt--; renderAsk(); }
});
document.getElementById('ask-example').addEventListener('click', function(){
  draft = Object.assign({}, D.baseline_raw);
  finishAsk(true);
});
document.getElementById('ask-restart').addEventListener('click', function(){
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
  draft = Object.assign({}, D.baseline_raw);
  answered = {};
  askAt = 0;
  renderAsk();
});

/* ---- the reveals ----------------------------------------------------------------------------
   The chart is drawn for a width, and inside a closed <details> it has none. It is drawn when
   the reader opens it, and again if they resize afterwards. */
document.getElementById('uk-try').addEventListener('click', function(){
  var tp = document.getElementById('testplan');
  tp.hidden = !tp.hidden;
  this.setAttribute('aria-expanded', String(!tp.hidden));
});

applyLanguage(lang, false);

/* A page that opens on the report is a page that answered a question nobody asked yet. The
   only way in that skips the questions is the explicit worked-example link. */
(function boot(){
  document.getElementById('cursel').addEventListener('change', function(){
    cur = this.value;
    try { localStorage.setItem('dc_cur', cur); } catch(e){}
    render();                                  // presentation only: nothing is recomputed
  });
  if(P.get('demo') === '1' || !FLOW.length){ finishAsk(true); return; }
  // Answers from last time mean last time's result, straight away.
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(saved){
      var complete = FLOW.every(function(st){
        return st.fields.every(function(f){ return isFinite(parseFloat(saved[f])); }); });
      if(complete){
        FLOW.forEach(function(st){ st.fields.forEach(function(f){
          draft[f] = parseFloat(saved[f]); answered[f] = true; }); });
        if(!validate(draft).length){ finishAsk(false); return; }
      }
    }
  } catch(e){}
  showScreen('ask');
  renderAsk();
})();
})();
</script>
