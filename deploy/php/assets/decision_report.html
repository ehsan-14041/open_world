/* The day the modelled event begins, read off the scenario rather than assumed. */
function shockStart(){
  try {
    var evs = D.reproducibility.worlds[0].spec.events || [];
    if(!evs.length) return null;
    var d = evs[0].start_turn;
    return (typeof d === 'number' && isFinite(d)) ? d : null;
  } catch(e){ return null; }
}

/* The day a cash curve stops rising and starts giving it back, or null if it never does.
   A curve that drifts down by a rounding error has not turned over, so the fall has to be
   worth naming before the chart names it. */
function turnDay(cash){
  var best = 0;
  for(var i=1;i<=H;i++) if(cash[i] > cash[best]) best = i;
  if(best === 0 || best >= H) return null;
  var fall = cash[best] - cash[H];
  if(fall < Math.abs(cash[best]) * 0.005) return null;
  return best;
}

/* Axis figures carry a short symbol but not a word — see the caption for the word. */
/* A currency whose figures run to ten digits — rial, toman, dong — turns a 54-pixel axis
   margin into a row of clipped numbers. So the whole chart picks one scale, the caption names
   it, and the ticks stay short. The arithmetic never sees any of this. */
function moneyScale(top){
  var a = Math.abs(top);
  if(a >= 1e9) return {d: 1e9, w: t('scale_billion')};
  if(a >= 1e6) return {d: 1e6, w: t('scale_million')};
  // Below a million the full figure is both short enough and more familiar.
  return {d: 1, w: ''};
}
function scaled(v, sc){
  if(sc.d === 1) return (v < 0 ? '−' : '') + NF.format(Math.abs(Math.round(v)));
  var x = v / sc.d;
  return (x < 0 ? '−' : '') + num(Math.abs(x), Math.abs(x) < 100 ? 1 : 0);
}
/* The same figure where a word will fit: "480 million". */
function shortMoney(v, sc){ return scaled(v, sc) + (sc.w ? ' ' + sc.w : ''); }
/* "cash · million rial" — the unit said once, where the ticks cannot carry it. */
function axisCaption(sc){
  var unit = cur ? (curIsWord() ? (sc.w ? sc.w + ' ' + cur : cur)
                                : (sc.w ? cur + ' ' + sc.w : cur))
                 : sc.w;
  return t('chart_axis_unit') + (unit ? ' · ' + unit : '');
}

/* "If you do nothing", on its own. One line, drawn at the size it is seen at, annotated
   from its own trajectory: where the increase lands, where holding still stops paying, and
   where it ends up. For a business whose problem is a full diary, the marker is the day the
   diary fills instead. Nothing here is computed — it is the ledger the engine already made,
   read out loud. */
function drawSolo(out){
  var svg = document.getElementById('chart-now');
  var own = svg.getBoundingClientRect().width;
  var W = Math.round(own || svg.parentElement.getBoundingClientRect().width || 0);
  if(W < 100) W = 960;                    // hidden or unlaid-out: draw for the common case
  W = Math.max(300, W);
  var narrow = W < 560;
  var Hh = narrow ? 240 : 300, pl = narrow ? 54 : 70, pr = 18, pt = 26, pb = 34;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
  svg.dataset.w = W;
  var c = out.A.L.cash, mn = Math.min.apply(null, c.slice(0, H + 1)),
      mx = Math.max.apply(null, c.slice(0, H + 1));
  var lo = Math.min(mn, c[0]), hi = Math.max(mx, c[0]);
  var step = niceStep(Math.max(1, hi - lo), 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if(hi === lo) hi = lo + step;
  var SC = moneyScale(Math.max(Math.abs(lo), Math.abs(hi)));
  function x(d){ return pl + d * (W - pl - pr) / H; }
  function y(v){ return pt + (hi - v) * (Hh - pt - pb) / (hi - lo); }
  var m = '';
  for(var v = lo; v <= hi + 1e-9; v += step)
    m += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v)
       + '" stroke="var(--grid)"/>'
       + '<text x="' + (pl - 9) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="12"'
       + ' fill="var(--muted)" direction="ltr">' + scaled(v, SC) + '</text>';
  // The scale and the unit, said once where the ticks cannot carry them.
  m += '<text x="' + (pl - 44 > 0 ? pl - 44 : 2) + '" y="' + (pt - 10) + '" font-size="11.5"'
     + ' fill="var(--muted)" letter-spacing=".06em">' + esc(axisCaption(SC)) + '</text>';
  (narrow ? [0, 45, 90] : [0, 30, 60, 90]).forEach(function(d){
    var anchor = d === 0 ? 'start' : (d === H ? 'end' : 'middle');
    m += '<text x="' + x(d) + '" y="' + (Hh - 8) + '" text-anchor="' + anchor
       + '" font-size="12" fill="var(--muted)">' + t('day', {n: num(d)}) + '</text>'; });
  var path = 'M' + x(0) + ',' + y(c[0]);
  for(var d = 1; d <= H; d++) path += ' L' + x(d) + ',' + y(c[d]);
  m += '<path d="' + path + ' L' + x(H) + ',' + y(lo) + ' L' + x(0) + ',' + y(lo)
     + ' Z" fill="var(--a)" opacity=".08"/>'
     + '<path d="' + path + '" fill="none" stroke="var(--a)" stroke-width="3"'
     + ' stroke-linejoin="round" stroke-linecap="round"/>';
  var shockDay = shockStart();
  if(shockDay !== null && shockDay >= 0 && shockDay < H){
    var sl = t('chart_shock');
    m += '<line x1="' + x(shockDay) + '" x2="' + x(shockDay) + '" y1="' + pt + '" y2="' + (Hh - pb)
       + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>';
    if(x(shockDay) + 6 + sl.length * 6 <= W - pr)
      m += '<text x="' + (x(shockDay) + 6) + '" y="' + (Hh - pb - 8)
         + '" font-size="12" fill="var(--muted)">' + esc(sl) + '</text>';
  }
  var turn = turnDay(c);
  if(turn !== null){
    var label = w('chart_turn'), tx = x(turn), ty = y(c[turn]);
    var est = label.length * 6.3, anchor = 'start', at = tx + 8;
    if(at + est > W - pr){ anchor = 'end'; at = tx - 8; }
    var fits = (anchor === 'start') ? (at + est <= W - pr) : (at - est >= pl);
    m += '<circle cx="' + tx + '" cy="' + ty + '" r="4.5" fill="none" stroke="var(--a)"'
       + ' stroke-width="2"/>';
    if(fits)
      m += '<text x="' + at + '" y="' + (ty - 12) + '" font-size="12.5" fill="var(--a)"'
         + ' text-anchor="' + anchor + '">' + esc(label) + '</text>';
  }
  // A diary that fills up is this wedge's version of "doing nothing stops working".
  if(out.A.L.util && out.A.L.util.length){
    for(var sd = 1; sd <= H; sd++) if(out.A.L.util[sd] >= 99.5){
      m += '<circle cx="' + x(sd) + '" cy="' + y(c[sd]) + '" r="4.5" fill="none"'
         + ' stroke="var(--c)" stroke-width="2"/>';
      break;
    }
  }
  m += '<circle cx="' + x(H) + '" cy="' + y(c[H]) + '" r="4" fill="var(--a)"/>'
     + '<text x="' + (x(H) - 8) + '" y="' + (y(c[H]) - 10) + '" font-size="13" font-weight="600"'
     + ' fill="var(--a)" text-anchor="end" direction="ltr">' + shortMoney(c[H], SC) + '</text>';
  svg.innerHTML = m;
}

/* The census, as a picture: one dot per tested case, coloured by its winner, grouped by the
   assumption that decides. 130 of 162 stops being a sentence — you can see where the answer

          return '<i style="--dc:var(--' + pp.rank[0].toLowerCase() + ')"></i>'; }).join('')
      + '</span><span class="cc">' + fill(t('census_block'),
          {opt: esc(w('world_short')[top]), n: num(cnt[top]), total: num(pts.length)})
      + '</span></button>';
  }).join('');
}

function drawChart(out, lead){
  var svg = document.getElementById('chart');
  // The svg's own width, so one unit in the drawing is one pixel on the glass and a 12px
  // label is 12px. Falls back to the wrapper before first layout.
  var own = svg.getBoundingClientRect().width;
  var W = Math.round(own || svg.parentElement.getBoundingClientRect().width || 0);
  if(W < 100) W = 960;                    // hidden or unlaid-out: draw for the common case
  W = Math.max(300, W);
  var narrow = W < 560;
  var Hh = narrow ? 300 : 380;
  svg.dataset.w = W;
  // On a narrow chart the right margin held the end-of-line figures. They move to the table
  // directly below rather than being squeezed into a margin that is no longer there.
  var pl = narrow ? 54 : 74, pr = narrow ? 16 : 104, pt = narrow ? 30 : 24, pb = 38;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
  var all = []; WID.forEach(function(id){ all = all.concat(out[id].L.cash.slice(0,H+1)); });
  if(OWN_OUT) all = all.concat(OWN_OUT.L.cash.slice(0,H+1));
  var mn = Math.min.apply(null,all), mx = Math.max.apply(null,all);
  var lo = (mn < 0.25*mx) ? Math.min(0, mn) : mn, hi = mx;
  var step = niceStep(hi-lo, 4);
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step; if(hi===lo) hi = lo+step;
  var SC = moneyScale(Math.max(Math.abs(lo), Math.abs(hi)));
  function x(d){ return pl + d*(W-pl-pr)/H; }
  function y(v){ return pt + (hi-v)*(Hh-pt-pb)/(hi-lo); }
  var s = '';
  for(var v=lo; v<=hi+1e-9; v+=step)
    s += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)"/>'
       + '<text x="'+(pl-9)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)"'
       + ' direction="ltr">'+scaled(v, SC)+'</text>';
  var axisCap = axisCaption(SC);
  s += '<text x="'+(pl-44>0?pl-44:2)+'" y="'+(pt-10)+'" font-size="11.5" fill="var(--muted)"'
     + ' letter-spacing=".06em">'+esc(axisCap)+'</text>';
  (narrow ? [0,45,90] : [0,30,60,90]).forEach(function(d){
    var anchor = d === 0 ? 'start' : (d === H ? 'end' : 'middle');
    s += '<text x="'+x(d)+'" y="'+(Hh-10)+'" text-anchor="'+anchor+'" font-size="12" fill="var(--muted)">'
       + t('day',{n:num(d)}) + '</text>'; });
  if(lo<=0 && hi>0)
    s += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="4 4"/>'
       + '<text x="'+(W-pr+7)+'" y="'+(y(0)+4)+'" font-size="12" fill="var(--crit)">'+t('cash_zero')+'</text>';
  var bl = out[lead].L.cash, area = 'M'+x(0)+','+y(bl[0]);
  for(var d1=1; d1<=H; d1++) area += ' L'+x(d1)+','+y(bl[d1]);
  area += ' L'+x(H)+','+y(lo)+' L'+x(0)+','+y(lo)+' Z';
  s += '<path d="'+area+'" fill="var(--'+lead.toLowerCase()+')" opacity=".08"/>';
  var ends = WID.map(function(id){ return {id:id, ty:y(out[id].L.cash[H])}; })
                .sort(function(a,b){ return a.ty-b.ty; });
  for(var i=1;i<ends.length;i++) if(ends[i].ty-ends[i-1].ty < 17) ends[i].ty = ends[i-1].ty + 17;
  WID.forEach(function(id){
    var c = out[id].L.cash, p = 'M'+x(0)+','+y(c[0]);
    for(var d2=1; d2<=H; d2++) p += ' L'+x(d2)+','+y(c[d2]);
    s += '<path d="'+p+'" fill="none" stroke="var(--'+id.toLowerCase()+')" stroke-width="'+(id===lead?3.5:2)
       + '" stroke-linejoin="round" stroke-linecap="round"/>';
    var e = ends.filter(function(z){ return z.id===id; })[0];
    s += '<circle cx="'+x(H)+'" cy="'+y(c[H])+'" r="4" fill="var(--'+id.toLowerCase()+')"/>';
    if(!narrow)
      s += '<text x="'+(x(H)+8)+'" y="'+(e.ty+4)+'" font-size="13" font-weight="600" fill="var(--'
         + id.toLowerCase()+')" direction="ltr">'+id+' '+shortMoney(c[H], SC)+'</text>';
  });
  if(OWN_OUT){
    var oc = OWN_OUT.L.cash, op = 'M'+x(0)+','+y(oc[0]);
    for(var d3=1; d3<=H; d3++) op += ' L'+x(d3)+','+y(oc[d3]);
    s += '<path id="own-line" d="'+op+'" fill="none" stroke="var(--ink)" stroke-width="2.25"'
       + ' stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>'
       + '<circle cx="'+x(H)+'" cy="'+y(oc[H])+'" r="4" fill="var(--ink)"/>';
  }
  s += '<circle cx="'+x(0)+'" cy="'+y(out.A.L.cash[0])+'" r="3.5" fill="var(--ink)"/>'
     + '<text x="'+x(0)+'" y="'+(y(out.A.L.cash[0])+20)+'" font-size="12" fill="var(--muted)">'
     + t('chart_today')+' '+shortMoney(out.A.L.cash[0], SC)+'</text>';

  /* Where the increase lands. It is day one here, so the rule is drawn thin and labelled at the
     top, clear of the "today" figure sitting on the axis. */
  var shockDay = shockStart();
  if(shockDay !== null && shockDay >= 0 && shockDay < H){
    var sl = t('chart_shock');
    s += '<line x1="'+x(shockDay)+'" x2="'+x(shockDay)+'" y1="'+pt+'" y2="'+(Hh-pb)
       + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>';
    if(x(shockDay) + 6 + sl.length * 6 <= W - pr)
      s += '<text x="'+(x(shockDay)+6)+'" y="'+(Hh-pb-8)+'" font-size="12"'
         + ' fill="var(--muted)">' + esc(sl) + '</text>';
  }

  /* Where doing nothing stops working: the day A's cash peaks before falling away. Taken from
     the trajectory itself, so it is only drawn when the curve really does turn over — a wedge
     whose A never declines gets no annotation rather than a made-up one. */
  /* The day the leader pulls away from doing nothing. Everything starts from the same cash,
     so the day the gap first becomes real is the day the decision starts paying. */
  if(lead !== 'A'){
    var la = out.lead === undefined ? out[lead].L.cash : out[lead].L.cash, aa = out.A.L.cash;
    var thr = Math.max(1, Math.abs(aa[0]) * 0.005), od = null, wasBehind = false;
    for(var dd = 1; dd <= H; dd++){
      if(la[dd] < aa[dd] - thr) wasBehind = true;
      else if(wasBehind && la[dd] - aa[dd] > thr){ od = dd; break; }
    }
    // Only a real crossover is worth a label: the leader fell behind first (lost orders bite
    // before the higher price pays) and then came back past. A line that led from day one
    // has no overtaking day, and saying "from day 2" would be noise dressed as insight.
    if(od !== null){
      var ol = fill(t('overtake'), {d: num(od), b: w('world_short')[lead], a: w('world_short').A});
      var oy = y(out[lead].L.cash[od]);
      s += '<circle cx="' + x(od) + '" cy="' + oy + '" r="4.5" fill="none"'
         + ' stroke="var(--' + lead.toLowerCase() + ')" stroke-width="2"/>';
      var oEst = ol.length * 6.3, oAnchor = 'start', oAt = x(od) + 8;
      if(oAt + oEst > W - pr){ oAnchor = 'end'; oAt = x(od) - 8; }
      if((oAnchor === 'start' ? oAt + oEst <= W - pr : oAt - oEst >= pl))
        s += '<text x="' + oAt + '" y="' + (oy + 22) + '" font-size="12.5"'
           + ' fill="var(--' + lead.toLowerCase() + ')" text-anchor="' + oAnchor + '">'
           + esc(ol) + '</text>';
    }
  }

  var turn = turnDay(out.A.L.cash);
  if(turn !== null){
    var tx = x(turn), ty = y(out.A.L.cash[turn]);
    var label = w('chart_turn');
    // No text metrics inside an SVG string, so the width is estimated and the label is placed
    // on whichever side it fits — and if it fits on neither, it is not drawn at all rather
    // than drawn off the edge.
    var est = label.length * 6.3, x0 = pl, x1 = W - pr;
    var anchor = 'start', at = tx + 8;
    if(at + est > x1){ anchor = 'end'; at = tx - 8; }
    var fits = (anchor === 'start') ? (at + est <= x1) : (at - est >= x0);
    s += '<circle cx="'+tx+'" cy="'+ty+'" r="4.5" fill="none" stroke="var(--a)" stroke-width="2"/>'
       + '<line x1="'+tx+'" x2="'+tx+'" y1="'+(ty-9)+'" y2="'+(ty-26)+'" stroke="var(--a)" stroke-width="1"/>';
    if(fits)
      s += '<text x="'+at+'" y="'+(ty-30)+'" font-size="12.5" fill="var(--a)" text-anchor="'+anchor+'">'
         + esc(label) + '</text>';
  }
  s += '<g id="hover" style="display:none"><line id="hl" y1="'+pt+'" y2="'+(Hh-pb)
     + '" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3"/>'
     + WID.map(function(id){ return '<circle id="hc'+id+'" r="4.5" fill="var(--'+id.toLowerCase()
         +')" stroke="var(--raised)" stroke-width="2"/>'; }).join('') + '</g>';
  svg.innerHTML = s;

  var tip = document.getElementById('tip'), hov = svg.querySelector('#hover'), SHORT = w('world_short');
  function show(ev){
    var rect = svg.getBoundingClientRect(); if(!rect.width) return;
    var px = (ev.clientX - rect.left) * (W / rect.width);
    var d = Math.max(0, Math.min(H, Math.round((px - pl) * H / (W - pl - pr))));
    if(px < pl-10 || px > W-pr+10){ hide(); return; }
    hov.style.display = '';
    svg.querySelector('#hl').setAttribute('x1', x(d)); svg.querySelector('#hl').setAttribute('x2', x(d));
    WID.forEach(function(id){ var c = svg.querySelector('#hc'+id);
      c.setAttribute('cx', x(d)); c.setAttribute('cy', y(out[id].L.cash[d])); });
    tip.innerHTML = '<b>'+t('day',{n:num(d)})+'</b>' + WID.map(function(id){
      return '<span><span>'+id+' · '+esc(SHORT[id])+'</span><span>'+money(out[id].L.cash[d])+'</span></span>';
    }).join('');
    tip.style.display = 'block';
    var wr = svg.parentElement.getBoundingClientRect();
    var left = ev.clientX - wr.left + 14; if(left + 200 > wr.width) left = ev.clientX - wr.left - 210;
    tip.style.left = Math.max(8,left)+'px'; tip.style.top = Math.max(8, ev.clientY - wr.top - 72)+'px';
  }
  function hide(){ hov.style.display = 'none'; tip.style.display = 'none'; }
  svg.onpointermove = show; svg.onpointerdown = show; svg.onpointerleave = hide;
}

/* One set of rules about what makes a usable baseline, used by the flow and by the full form
   so the two can never disagree about which numbers the page will accept. */
function validate(nb){
  var errs = [], IF = w('intake'), sepc = (lang === 'fa') ? '، ' : ', ';
  var zero = [];
  [F.revenue, F.units_per_day, F.unit_cost_total].forEach(function(k){
    if(!(nb[k] > 0)) zero.push((IF[k] && IF[k].label) || k); });
  if(zero.length) errs.push(fill(t('err_positive'), {names: zero.join(sepc)}));
  else if(nb[F.unit_cost_total] >= nb[F.revenue]) errs.push(t('err_cost_high'));
  if(F.utilisation && !(nb[F.utilisation] > 0 && nb[F.utilisation] <= 100)) errs.push(t('err_utilisation'));
  if(nb[F.fixed] < 0 || nb[F.cash] < 0)
    errs.push(fill(t('err_positive'), {names: (IF[F.fixed] && IF[F.fixed].label) || F.fixed}));
  return errs;
}

/* The same rules validate() applies at the end, but asked of what has been answered so far and
   carrying the fields they are about. A figure that cannot be right is then caught on the screen
   where it was typed, with the number still in front of the reader, instead of three screens
   later on a step that has nothing to do with it. */
function askProblems(){
  var out = [];
  function known(k){ return !!k && answered[k] && isFinite(draft[k]); }
  if(known(F.unit_cost_total) && known(F.revenue) && draft[F.unit_cost_total] >= draft[F.revenue])
    out.push({msg: t('err_cost_high'), why: t('err_cost_high_why'),
              fields: [F.unit_cost_total, F.revenue]});
  if(known(F.utilisation) && !(draft[F.utilisation] > 0 && draft[F.utilisation] <= 100))
    out.push({msg: t('err_utilisation'), why: '', fields: [F.utilisation]});
  return out;
}

/* Which screen owns a figure, so the flow can go back to it rather than one step back. */
function stepOf(field){
  for(var i = 0; i < FLOW.length; i++)
    if(FLOW[i].fields.indexOf(field) !== -1) return i;
  return -1;
}

/* A render that dies part-way is the dangerous kind of failure: the top of the page shows the
   new figures while the bottom still describes the previous ones, and nothing looks wrong. The
   page would rather say it is broken than quietly show a customer someone else's numbers. */
(function guardRender(){
  var inner = render;
  render = function(langChanged){
    try { inner(langChanged); if(showing === 'sheet') renderSheet(); }
    catch(err){
      // fail() raises its own error to stop the page, so the original cause is logged
      // first — otherwise the only thing left is the message shown to the reader.
      if(window.console && console.error) console.error('render failed:', err);
      fail(t('render_failed'));
    }
  };
})();

(function stickyCta(){
  var bar = document.getElementById('sticky'), go = document.getElementById('sticky-go');
  var cards = document.getElementById('options');
  go.addEventListener('click', function(){
    // Back into the questions, with the previous answers still filled in.
    showScreen('ask');
    askAt = 0;
    renderAsk();
    window.scrollTo({top: 0, behavior: motionOK() ? 'smooth' : 'auto'});
  });
  var shown = null;
  function update(){
    var want = showing === 'result' && cards.getBoundingClientRect().bottom < 0;
    if(want === shown) return;
    shown = want;
    bar.hidden = !want;
    document.body.classList.toggle('has-sticky', want);
  }
  var queued = false;
  function onScroll(){
    if(queued) return;
    queued = true;
    requestAnimationFrame(function(){ queued = false; update(); });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  update();
  window.__stickyUpdate = update;      // so the state can be checked without a real scroll

  /* The charts are drawn for one width, so a changed width needs a redraw — and "changed"
     includes gaining a width at all: a tab opened in the background lays out at zero and
     only later becomes real. Resize covers the first case; the observer covers the second. */
  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ if(showing === 'result') render(true); }, 160);
  });
  if('IntersectionObserver' in window){
    var watch = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting || showing !== 'result') return;
        var el = en.target, wNow = Math.round(el.getBoundingClientRect().width);
        if(wNow > 100 && Math.abs(wNow - (parseInt(el.dataset.w, 10) || 0)) > 40) render(true);
      });
    }, {threshold: 0.05});
    watch.observe(document.getElementById('chart'));
    watch.observe(document.getElementById('chart-now'));
  }
})();


/* ---- the question flow ---------------------------------------------------------------------
   The owner answers a few questions and then gets an answer. Every question here is an input
   the model needs; the flow does not invent one to seem thorough, and does not skip one and
   guess it. `base` is only written once, at the end, so a half-finished flow can never leave
   the page showing a comparison of half-entered figures. */
var FLOW = (C.flow || []).slice();
var askAt = 0;
var draft = Object.assign({}, D.baseline_raw);
var answered = {};                       // fields the owner has actually filled in
var showing = 'ask';

function stepQ(step){ return (w('flow_q') || {})[step.key] || ''; }
function stepChoices(step){ return (w('flow_choices') || {})[step.key] || null; }

function showScreen(which){
  showing = which;
  document.getElementById('ask').hidden = (which !== 'ask');
  document.getElementById('result').hidden = (which !== 'result');
  document.getElementById('sheet').hidden = (which !== 'sheet');
  document.body.classList.toggle('asking', which === 'ask');
  document.body.classList.toggle('on-sheet', which === 'sheet');
  if(window.__stickyUpdate) window.__stickyUpdate();
}

function renderAsk(){
  if(!FLOW.length){ finishAsk(true); return; }
  var step = FLOW[askAt], IF = w('intake'), body = document.getElementById('ask-body');
  document.getElementById('ask-progress').textContent =
      fill(t('flow_step_of'), {n: num(askAt + 1), total: num(FLOW.length)});
  document.getElementById('ask-bar').style.width = ((askAt + 1) / FLOW.length * 100) + '%';
  document.getElementById('ask-q').textContent = stepQ(step);
  document.getElementById('ask-err').textContent = '';
  if(step.variants){ /* filled below, where the trade choices are built */ }

  /* One step asks which trade rather than for a figure. It writes no model input — it only
     decides which words the rest of the flow is asked in. */
  if(step.variants){
    var ids = variantIds();
    body.innerHTML = '<div class="choices">'
      + '<button type="button" class="choice' + (!variant ? ' on' : '') + '" data-var="">'
      + esc(L.wedge.business) + '</button>'
      + ids.map(function(v){
          return '<button type="button" class="choice' + (variant === v ? ' on' : '')
               + '" data-var="' + esc(v) + '">' + esc(L.wedge.variants[v].business) + '</button>';
        }).join('') + '</div>';
    document.getElementById('ask-hint').textContent = t('flow_kind_hint');
    document.getElementById('ask-q').textContent = t('flow_kind_q');
    document.getElementById('ask-back').textContent = t('flow_back');
    document.getElementById('ask-back').style.visibility = askAt === 0 ? 'hidden' : '';
    document.getElementById('ask-next').textContent =
        askAt === FLOW.length - 1 ? t('flow_see') : t('flow_next');
    document.getElementById('ask-example').textContent = t('flow_example');
    document.getElementById('ask-restart').textContent = t('start_over');
    return;
  }

  var choices = stepChoices(step);
  var hint = '';
  if(choices){
    var f = step.fields[0];
    body.innerHTML = '<div class="choices">' + Object.keys(choices).map(function(v){
        var on = String(draft[f]) === String(v);
        return '<button type="button" class="choice' + (on ? ' on' : '') + '" data-f="' + esc(f)
             + '" data-v="' + esc(v) + '">' + esc(choices[v]) + '</button>'; }).join('')
      + (step.other ? '<button type="button" class="choice other" data-other="' + esc(f) + '">'
           + esc(t('flow_other')) + '</button>' : '')
      + '</div><div class="otherwrap" id="otherwrap" hidden></div>';
    // A figure that arrived with a question may not be one of the offered choices. It is shown
    // in the "other" box, filled in, rather than silently replaced by the nearest choice.
    if(step.other && answered[f] && !Object.prototype.hasOwnProperty.call(choices, String(draft[f]))){
      var ow = document.getElementById('otherwrap');
      ow.hidden = false;
      ow.innerHTML = '<label class="askfield"><span class="in"><input id="a_' + f + '" data-k="' + f
        + '" type="number" inputmode="decimal" step="any" value="' + esc(String(draft[f])) + '">'
        + '<span class="u">' + PS() + '</span></span></label>';
      var ob = body.querySelector('.choice.other');
      if(ob) ob.classList.add('on');
    }
  } else {
    // The unit belongs with the first figure, not at the bottom of a disclosure nobody opens.
    var moneyStep = step.fields.indexOf(F.revenue) >= 0;
    body.innerHTML = '<div class="askfields">' + step.fields.map(function(f){
        var meta = IF[f] || {}, isPct = /_pct$/.test(f);
        hint = hint || meta.hint || '';
        return '<label class="askfield"><span class="afl">' + esc(meta.label || f) + '</span>'
          + '<span class="in"><input id="a_' + f + '" data-k="' + f + '" type="number"'
          + ' inputmode="decimal" step="any" value="'
          + (answered[f] ? esc(String(draft[f])) : '') + '"'
          + ' placeholder="' + esc(String(D.baseline_raw[f])) + '">'
          + (isPct ? '<span class="u">' + PS() + '</span>' : '') + '</span></label>';
      }).join('') + '</div>'
      + (moneyStep ? '<div class="curr-row ask-curr"><label for="cur-ask" id="cur-ask-l"></label>'
           + '<select id="cur-ask"></select></div>' : '');
    if(moneyStep){
      document.getElementById('cur-ask-l').textContent = t('currency_ask');
      document.getElementById('cur-ask').innerHTML = currencyOptions();
    }
  }
  document.getElementById('ask-hint').textContent = choices ? '' : (hint || t('flow_approx'));
  document.getElementById('ask-back').textContent = t('flow_back');
  document.getElementById('ask-back').style.visibility = askAt === 0 ? 'hidden' : '';
  document.getElementById('ask-next').textContent =
      askAt === FLOW.length - 1 ? t('flow_see') : t('flow_next');
  document.getElementById('ask-example').textContent = t('flow_example');
  document.getElementById('ask-restart').textContent = t('start_over');
  /* Focus follows the question, whatever the motion setting: the screen that had it was just
     replaced. A figure step puts it in the first box; a choice step on the question itself, so a
     screen reader reads the new question out. Reduced motion only stops the scroll. */
  var first = body.querySelector('input');
  setTimeout(function(){
    (first || document.getElementById('ask-q')).focus({preventScroll: !motionOK()});
  }, 60);
}

/* Reading a screen's answers into the draft. Returns the label of anything unreadable, so the
   flow can say which figure it could not use rather than refusing as a whole. */
function readStep(){
  var step = FLOW[askAt], IF = w('intake'), bad = [];
  Array.prototype.forEach.call(document.querySelectorAll('#ask-body input[data-k]'), function(i){
    var k = i.dataset.k;
    var raw = String(i.value).replace(/[,\s٬،]/g, '')
      .replace(/[۰-۹]/g, function(ch){ return String(ch.charCodeAt(0) - 0x06F0); })
      .replace(/[٠-٩]/g, function(ch){ return String(ch.charCodeAt(0) - 0x0660); });
    var v = parseFloat(raw);
    if(!isFinite(v) || v < 0) bad.push((IF[k] && IF[k].label) || k);
    else { draft[k] = v; answered[k] = true; }
  });
  return bad;
}

var STORE_KEY = 'dc_ans_' + D.wedge.id;
function finishAsk(isDemo){
  draft.is_demo = !!isDemo;
  if(!isDemo) draft.name = '';           // these are your figures, not the fictional cafe's
  if(!isDemo){
    // A tool remembers. Only the answers travel — never the demo's stand-ins.
    try {
      var keep = {};
      FLOW.forEach(function(st){ st.fields.forEach(function(f){ keep[f] = draft[f]; }); });
      localStorage.setItem(STORE_KEY, JSON.stringify(keep));
      arrivedWithAnswers = true;
    } catch(e){}
  }
  base = draft;
  render();
  showScreen('result');
  window.scrollTo({top: 0, behavior: motionOK() ? 'smooth' : 'auto'});
}

document.getElementById('ask-body').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.var !== undefined){
    setVariant(b.dataset.var);
    Array.prototype.forEach.call(document.querySelectorAll('#ask-body .choice'),
      function(c){ c.classList.toggle('on', c === b); });
    setTimeout(nextStep, 140);
    return;
  }
  if(b.dataset.other !== undefined){
    var wrap = document.getElementById('otherwrap');
    wrap.hidden = false;
    wrap.innerHTML = '<label class="askfield"><span class="in"><input id="a_' + b.dataset.other
      + '" data-k="' + b.dataset.other + '" type="number" inputmode="decimal" step="any"'
      + ' placeholder="' + esc(String(D.baseline_raw[b.dataset.other])) + '"'
      + ' value=""><span class="u">' + PS() + '</span></span></label>';
    Array.prototype.forEach.call(document.querySelectorAll('#ask-body .choice'),
      function(c){ c.classList.remove('on'); });
    b.classList.add('on');
    wrap.querySelector('input').focus();
    return;
  }
  if(b.dataset.f === undefined) return;
  draft[b.dataset.f] = parseFloat(b.dataset.v);
  answered[b.dataset.f] = true;
  Array.prototype.forEach.call(document.querySelectorAll('#ask-body .choice'),
    function(c){ c.classList.toggle('on', c === b); });
  var wrap2 = document.getElementById('otherwrap');
  if(wrap2){ wrap2.hidden = true; wrap2.innerHTML = ''; }
  // A tapped choice is an answer; carrying straight on is what the reader expects.
  setTimeout(nextStep, 140);
});

document.getElementById('ask-body').addEventListener('keydown', function(e){
  /* Enter in a box moves on. Enter on a choice is that choice: a button's own Enter is its click,
     and taking it here instead once skipped the owner's answer and used the default. */
  if(e.key === 'Enter' && !(e.target && e.target.closest && e.target.closest('button'))){
    e.preventDefault(); nextStep(); }
});

function nextStep(){
  var bad = readStep();
  if(bad.length){
    document.getElementById('ask-err').textContent =
      fill(t('err_positive'), {names: bad.join(lang === 'fa' ? '، ' : ', ')});
    return;
  }
  // Checked every step, so the answer that cannot work is refused where it was given.
  var probs = askProblems();
  if(probs.length){
    var prob = probs[0], home = stepOf(prob.fields[0]);
    // If the figure belongs to an earlier screen, go to it: "back" one step would land on a
    // question that has nothing to do with what is wrong.
    if(home !== -1 && home !== askAt){ askAt = home; renderAsk(); }
    showAskErr(prob);
    return;
  }
  if(askAt < FLOW.length - 1){ askAt++; renderAsk(); }
  else {
    // The same validation the full form applies, so the flow cannot produce a baseline the
    // rest of the page would refuse.
    var errs = validate(draft);
    if(errs.length){ document.getElementById('ask-err').textContent = errs[0]; return; }
    finishAsk(false);
  }
}

document.getElementById('ask-next').addEventListener('click', nextStep);
document.getElementById('ask-back').addEventListener('click', function(){
  readStep();
  if(askAt > 0){ askAt--; renderAsk(); }
});
document.getElementById('ask-example').addEventListener('click', function(){
  draft = Object.assign({}, D.baseline_raw);
  finishAsk(true);
});
document.getElementById('ask-restart').addEventListener('click', function(){
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
  draft = Object.assign({}, D.baseline_raw);
  answered = {};
  askAt = 0;
  renderAsk();
});



/* ---- the experiment loop ---------------------------------------------------------------------
   The comparison hangs on one number nobody knows for this business: how much custom its own
   customers give up when the price moves. The page suggests a small test; this is where its
   result comes back in.

   A before-and-after count is not a measurement of price sensitivity. A quiet fortnight, a
   holiday, a stock-out or a new item can move it as much as the price did — and under the
   model's own assumptions much of the customer reaction has not happened yet after two weeks.
   So a result is read in three parts that are kept apart: what the owner observed, what the
   model infers from it under its own assumptions, and what is still open. It changes the
   comparison only when exactly one tested setting fits it, the owner confirmed every
   condition, unchanged items were counted alongside the repriced ones, and the business is not
   capped by a diary. Anything else is kept as a note, and an inconclusive test is reported as
   the legitimate result it is. */
var MEASURE_KEY = 'dc_meas_' + D.wedge.id;
var TEST_KEY = 'dc_test_' + D.wedge.id;
var PLAN = {rise: 10, days: 14, n: 7};      // the suggested test: the second week after a 10% rise
var measure = null;                         // a readTest() result; older records carry no `v`
var testStarted = null;                     // iso date, or null
var TEST_STATES = ['supported', 'provisional', 'inconclusive', 'outside'];

function loadLoop(){
  try {
    var m = JSON.parse(localStorage.getItem(MEASURE_KEY) || 'null');
    if(m && isFinite(m.e)){
      // Recorded before the conditions were checked: kept as a note, never used by the comparison.
      if(m.v !== 2 || TEST_STATES.indexOf(m.status) < 0){ m.status = 'legacy'; m.band = null; }
      measure = m;
    }
    testStarted = localStorage.getItem(TEST_KEY) || null;
  } catch(e){}
}
function saveMeasure(){
  try {
    if(measure) localStorage.setItem(MEASURE_KEY, JSON.stringify(measure));
    else localStorage.removeItem(MEASURE_KEY);
  } catch(e){}
}

/* How quickly demand reacts at each of the model's speed settings, read from the model itself:
   the demand variable's daily response times each setting's multiplier. */
function speedRates(){
  var S = D.slice, R = D.roles, out = {};
  if(!S || !R) return out;
  var v = S.variables.filter(function(x){ return x.id === R.demand_var; })[0];
  if(!v) return out;
  S.axes.forEach(function(ax){
    if(ax.applies_to.indexOf(v.id) < 0 && v.axis !== ax.id) return;
    Object.keys(ax.mapping).forEach(function(k){
      var m = parseFloat(ax.mapping[k].response_multiplier);
      if(isFinite(m) && m > 0) out[k] = Math.min(1, (+v.response) * m);
    });
  });
  if(!Object.keys(out).length) out.central = Math.min(1, +v.response);
  return out;
}
/* The share of the eventual reaction visible, on average, over days `from`..`to` after a step
   change in price — the model's own relaxation, dev(t) = target·(1 − (1 − r)^t). */
function visibleShare(r, from, to){
  var sum = 0;
  for(var d = from; d <= to; d++) sum += 1 - Math.pow(1 - r, d);
  return sum / (to - from + 1);
}
/* For each price-sensitivity setting: the drop the model expects over that window, lowest and
   highest across its reaction speeds. */
function bandRanges(rise, from, to){
  var rates = speedRates(), out = {};
  ['low', 'central', 'high'].forEach(function(k){
    if(C.sens_values[k] === undefined) return;
    var e = parseFloat(C.sens_values[k]);
    var vals = Object.keys(rates).map(function(s){ return e * rise / 100 * visibleShare(rates[s], from, to); });
    if(vals.length) out[k] = [Math.min.apply(null, vals), Math.max.apply(null, vals)];
  });
  return out;
}
function testPlanRanges(){ return bandRanges(PLAN.rise, PLAN.days - PLAN.n + 1, PLAN.days); }

/* The reading. `x` holds the owner's figures: the rise, how many days have passed, how many
   days each average covers, the repriced items' daily counts before and in the latest days,
   and — optionally — the same for unchanged items.

   Observed: the repriced items' change, the unchanged items' change, and the ratio of the two,
   which takes out whatever moved the whole business. Uncertainty: only the counting noise of
   daily totals (a Poisson approximation, two standard errors on the log ratio). Real weeks vary
   more than that, and the page says so; the range is used to decide what the result cannot
   rule out, never shown as a precise interval. Inferred: which settings, at any of the model's
   speeds, would produce a drop inside that range. */
function readTest(x){
  var ctl = x.ob > 0 && x.oa > 0;
  var ratio = (x.ta / x.tb) / (ctl ? x.oa / x.ob : 1);
  var inv = 1 / (x.tb * x.n) + 1 / (x.ta * x.n) + (ctl ? 1 / (x.ob * x.n) + 1 / (x.oa * x.n) : 0);
  var sd = Math.sqrt(inv);
  var lo = 1 - ratio * Math.exp(2 * sd), hi = 1 - ratio * Math.exp(-2 * sd);
  var from = Math.max(1, Math.round(x.days - x.n + 1)), to = Math.max(from, Math.round(x.days));
  var ranges = bandRanges(x.rise, from, to), fit = [];
  ['low', 'central', 'high'].forEach(function(k){
    var r = ranges[k];
    if(r && r[1] >= lo && r[0] <= hi) fit.push(k);
  });
  var checks = x.checksList.every(Boolean), capacity = !!F.utilisation;
  var status = !fit.length ? 'outside'
             : fit.length > 1 ? 'inconclusive'
             : (ctl && checks && x.n >= 7 && x.days >= 14 && !capacity) ? 'supported'
             : 'provisional';
  var drop = 1 - ratio;
  return {status: status, band: fit.length === 1 ? fit[0] : null, fit: fit,
          drop: drop, lo: lo, hi: hi, octl: ctl, checks: checks, capacity: capacity,
          tdrop: 1 - x.ta / x.tb, odrop: ctl ? 1 - x.oa / x.ob : null,
          // What was observed, per 1% of price, in the short run — not a long-run elasticity.
          e: drop / (x.rise / 100)};
}

/* Only a result that met every condition, and fits one setting the page actually tested, is
   allowed to set the comparison. */
function measureUsable(){
  return !!(measure && measure.status === 'supported' && measure.band
            && GRID_VALS[PRIMARY].indexOf(measure.band) >= 0);
}

function changePct(fr){ return pct(-fr * 100, 1); }        // a drop of 0.032 reads "−3.2%"

function measureLines(m){
  var name = function(k){ return (L.ui.setting_labels || {})[k] || k; };
  var sep = lang === 'fa' ? '، ' : ', ';
  var out = {status: '', obs: '', inf: '', open: []};
  if(m.status === 'legacy'){
    out.status = t('test_status_legacy');
    if(m.e > 0) out.obs = fill(t('test_obs_legacy'), {v: num(m.e, 2), rise: pct(m.rise)});
    out.open.push(t('test_open_legacy'));
    return out;
  }
  var bands = (m.fit || []).map(name).join(sep);
  out.status = fill(t('test_status_' + m.status), {band: m.band ? name(m.band) : '', bands: bands});
  out.obs = fill(t(m.octl ? 'test_obs_ctl' : 'test_obs'), {rise: pct(m.rise), days: num(m.days),
    n: num(m.n), t: changePct(m.tdrop), o: m.octl ? changePct(m.odrop) : '', rel: changePct(m.drop)});
  out.inf = (m.fit && m.fit.length) ? fill(t('test_inf'), {bands: bands}) : t('test_inf_none');
  if(!m.octl) out.open.push(t('test_open_noctl'));
  if(!m.checks) out.open.push(t('test_open_checks'));
  if(m.n < 7) out.open.push(t('test_open_short_n'));
  if(m.days < 14) out.open.push(t('test_open_short_days'));
  if(m.capacity) out.open.push(t('test_open_capacity'));
  out.open.push(t('test_open_noise'));
  out.open.push(t('test_open_items'));
  return out;
}

/* One line for the sheet, which carries only the result's state and not the counts. */
function sheetMeasureText(m){
  if(m.status === 'supported' && m.band)
    return fill(t('sheet_meas_supported'), {band: (L.ui.setting_labels || {})[m.band] || m.band});
  return fill(t('sheet_meas_other'), {rise: pct(m.rise), state: t('test_state_' + m.status)});
}

function renderLoop(){
  var run = document.getElementById('testrun');
  var startedLine = testStarted
    ? '<span class="ts">' + esc(fill(t('test_started_on'), {date: sheetDate(testStarted)}))
      + '</span><span class="ts-s">' + esc(t('test_come_back')) + '</span>'
    : '';
  run.innerHTML = (testStarted ? '<div class="ts-wrap">' + startedLine + '</div>' : '')
    + '<div class="tf-row">'
    + (testStarted ? '' : '<button type="button" class="btn" id="test-start">'
        + esc(t('test_start')) + '</button>')
    + '<button type="button" class="btn primary" id="test-enter">' + esc(t('test_enter'))
    + '</button></div>';

  var box = document.getElementById('measured');
  box.hidden = !measure;
  if(measure){
    var ml = measureLines(measure);
    var mv = document.getElementById('m-value');
    mv.textContent = ml.status;
    mv.className = 'm-v st-' + measure.status;
    var mo = document.getElementById('m-obs'), mi = document.getElementById('m-inf');
    mo.textContent = ml.obs; mo.hidden = !ml.obs;
    mi.textContent = ml.inf; mi.hidden = !ml.inf;
    document.getElementById('m-open').innerHTML = ml.open.map(function(x){
      return '<li>' + esc(x) + '</li>'; }).join('');
    document.getElementById('m-on').textContent = fill(t('measured_on'), {date: sheetDate(measure.date)});
    document.getElementById('m-clear').textContent = t('measured_clear');
  }
  document.getElementById('unknown-lead').textContent =
      measureUsable() ? t('measured_lead') : t('unknown_lead');
  renderShare();
}

document.getElementById('testrun').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.id === 'test-start'){
    var d = new Date();
    testStarted = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    try { localStorage.setItem(TEST_KEY, testStarted); } catch(err){}

document.getElementById('testform').addEventListener('submit', function(e){
  e.preventDefault();
  function readNum(id){
    var raw = String(document.getElementById(id).value).replace(/[,\s٬،]/g, '')
      .replace(/[۰-۹]/g, function(ch){ return String(ch.charCodeAt(0) - 0x06F0); })
      .replace(/[٠-٩]/g, function(ch){ return String(ch.charCodeAt(0) - 0x0660); });
    return raw === '' ? NaN : parseFloat(raw);
  }
  var x = {rise: readNum('tf-rise'), days: readNum('tf-days'), n: readNum('tf-n'),
           tb: readNum('tf-before'), ta: readNum('tf-after'),
           ob: readNum('tf-obefore'), oa: readNum('tf-oafter'),
           checksList: ['c1', 'c2', 'c3', 'c4'].map(function(c){
             return document.getElementById('tf-' + c).checked; })};
  var noCtl = isNaN(x.ob) && isNaN(x.oa);
  var ok = x.rise > 0 && x.rise <= 50 && x.tb > 0 && x.ta > 0 && x.n >= 1 && x.days >= x.n
        && (noCtl || (x.ob > 0 && x.oa > 0));
  if(!ok){
    document.getElementById('tf-err').textContent = t('test_bad');
    return;
  }
  if(noCtl){ x.ob = 0; x.oa = 0; }
  var d = new Date();
  measure = Object.assign({v: 2, date: d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())},
                          x, readTest(x));
  saveMeasure();
  // Otherwise the comparison keeps whatever it used before; the result stays a note.
  if(measureUsable()) sel[PRIMARY] = measure.band;
  try { localStorage.removeItem(SHARE_KEY); } catch(err){}
  document.getElementById('testform').hidden = true;
  render();
  document.getElementById('b-solid').scrollIntoView({behavior: motionOK() ? 'smooth' : 'auto',
                                                     block: 'start'});
});


/* ---- sharing one measurement ------------------------------------------------------------------
   The estimate this page starts from is borrowed from a 2010 study of eating out in the United
   States. The only way it ever gets better for the businesses actually using this is if owners
   who run the test are willing to say what it said.

   So it is asked for, once, next to the number it is about, with the exact row on screen before
   anything is sent — and the row is the measurement and nothing else. What an owner typed about
   their takings stays in their browser; there is no code path that puts it in a request. The
   offer only appears where a host can receive it, which the static build cannot. */
var SHARE_KEY = 'dc_shared_' + D.wedge.id;
var ANON_KEY = 'dc_anon';

function anonId(key){
  key = key || ANON_KEY;
  var v = null;
  try { v = localStorage.getItem(key); } catch(e){}
  if(!/^[a-z0-9]{8,32}$/.test(v || '')){
    v = '';

    // same browser rather than counted as a second business.

    try { localStorage.setItem(key, v); } catch(e){}
  }
  return v;
}

/* ---- the decision sheet ---------------------------------------------------------------------
   What an owner keeps after the comparison: one page with the choice they made, the three they
   compared, what it rests on, and what they are going to measure.

   It stores nothing. The figures travel inside the link and the page recomputes them, so a
   sheet cannot drift away from the model that produced it, two people opening the same link are
   reading the same arithmetic, and the reference at the top is a hash of that link — the same
   decision always has the same reference. */
var sheetState = null;
var arrivedWithAnswers = false;    // this browser has been through the flow itself
var FLOW_FIELDS = FLOW.reduce(function(a, st){ return a.concat(st.fields); }, []);

function b64url(str){
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64url(str){
  var t = String(str).replace(/-/g, '+').replace(/_/g, '/');
  while(t.length % 4) t += '=';
  return atob(t);
}

function packSheet(choice, iso){
  var a = [1, iso, choice,
    GRID_KEYS.map(function(k){ return sel[k]; }),
    FLOW_FIELDS.map(function(f){ return base[f]; })];
  /* An optional tail, trimmed from the end, so a sheet without the newer parts packs exactly as
     it always did and every link already handed out still opens. */
  var tail = [measure ? [Math.round(measure.e * 10000) / 10000, measure.rise, measure.date,
                         measure.status || 'legacy', measureUsable() ? measure.band : null] : null,
              variant || null,
              choice === 'D' ? [own.p, own.r ? 1 : 0] : null,
              // A sheet is read by someone else, on a browser that knows nothing of this owner.
              cur || null];
  while(tail.length && tail[tail.length - 1] === null) tail.pop();
  return b64url(JSON.stringify(a.concat(tail)));
}

/* Read a link back into the page's state. Anything malformed returns null rather than half-
   applying — a sheet built from a truncated link would be a document with someone else's
   numbers on it. */
function applySheet(packed){
  var a;
  try { a = JSON.parse(unb64url(packed)); } catch(e){ return null; }
  if(!a || a.length < 5 || a[0] !== 1) return null;
  var settings = a[3], values = a[4];
  if(!settings || settings.length !== GRID_KEYS.length) return null;
  if(!values || values.length !== FLOW_FIELDS.length) return null;
  var nb = Object.assign({}, D.baseline_raw), ok = true;
  FLOW_FIELDS.forEach(function(f, i){
    var v = parseFloat(values[i]);
    if(!isFinite(v)) ok = false; else nb[f] = v;
  });
  if(!ok || validate(nb).length) return null;
  if(['A','B','C','D'].indexOf(a[2]) < 0) return null;
  var ownIn = null;
  if(a[2] === 'D'){
    // An own option carries its levers, and needs a browser whose model passed its check.
    ownIn = a[7] ? parseOwn(String(a[7][0]) + ',' + (a[7][1] ? 1 : 0)) : null;
    if(!ownIn || !engineOK()) return null;
  }
  base = nb;
  GRID_KEYS.forEach(function(k, i){ sel[k] = settings[i]; });
  var m = null;
  if(a[5] && isFinite(parseFloat(a[5][0]))){
    // A link from before results were checked carries no state; it reads as a note.
    var ms = TEST_STATES.indexOf(a[5][3]) >= 0 ? a[5][3] : 'legacy';
    m = {v: ms === 'legacy' ? 1 : 2, e: parseFloat(a[5][0]), rise: parseFloat(a[5][1]) || 0,
         date: String(a[5][2] || ''), status: ms,
         band: (ms === 'supported' && GRID_VALS[PRIMARY].indexOf(a[5][4]) >= 0) ? a[5][4] : null};
  }
  // The document's own unit, for this view only; the reader's own setting is left alone.
  if(typeof a[8] === 'string' && CURRENCIES.indexOf(a[8]) >= 0) cur = a[8];
  setVariant(variantIds().indexOf(a[6]) >= 0 ? a[6] : null);
  if(ownIn){ own.p = ownIn.p; own.r = ownIn.r; own.on = true; }
  return {date: String(a[1]), choice: a[2], packed: packed, measure: m};
}

function sheetRef(packed){
  var h = 0x811c9dc5;
  for(var i = 0; i < packed.length; i++){
    h ^= packed.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  var out = h.toString(36).toUpperCase();
  while(out.length < 6) out = '0' + out;
  return out.slice(0, 6);
}

/* Stored unambiguously, shown the way the reader writes dates. */
function sheetDate(iso){
  var parts = String(iso).split('-');
  var d = new Date(+parts[0], (+parts[1] || 1) - 1, +parts[2] || 1);
  if(isNaN(d.getTime())) return iso;
  try {
    return new Intl.DateTimeFormat(L.numerals === 'arabext' ? 'fa-IR' : 'en-GB',
      {year: 'numeric', month: 'long', day: 'numeric'}).format(d);
  } catch(e){ return iso; }
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }

function makeSheet(choice){
  var d = new Date();
  var iso = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  var packed = packSheet(choice, iso);
  sheetState = {date: iso, choice: choice, packed: packed, measure: measure};
  sheetMine = true;
  try {
    var u = new URL(location.href);
    u.searchParams.delete('sheet');
    u.hash = 'sheet=' + packed;
    history.replaceState(null, '', u);
  } catch(e){}
  showScreen('sheet');
  renderSheet();
  window.scrollTo({top: 0, behavior: motionOK() ? 'smooth' : 'auto'});
}

/* ---- after the sheet: did it help? ------------------------------------------------------------
   The one way this page learns whether it was of use, and it is asked rather than observed.
   Each answer is optional; nothing is sent until the owner presses send, and the row is listed
   first. Its random id is its own, so it cannot be joined to a shared measurement or a question.

   row they chose to send, and only for this tab. */
var FB_KEY = 'dc_fb_' + D.wedge.id, FB_ANON = 'dc_anon_f', SRC_KEY = 'dc_src';
var fbAns = {}, sheetMine = false;
(function keepSource(){
  var s = String(P.get('src') || '').toLowerCase();
  if(/^[a-z0-9_-]{1,24}$/.test(s)){ try { sessionStorage.setItem(SRC_KEY, s); } catch(e){} }
})();
function fbSource(){
  var s = '';
  try { s = sessionStorage.getItem(SRC_KEY) || ''; } catch(e){}
  return /^[a-z0-9_-]{1,24}$/.test(s) ? s : null;
}
function fbState(){ try { return localStorage.getItem(FB_KEY) || ''; } catch(e){ return ''; } }
function fbQuestions(){
  return [{id: 'real', opts: ['now', 'later', 'no']},
          {id: 'helped', opts: ['yes', 'partly', 'no']},

function fbOptText(qid, v){
  if(qid === 'next' && v === 'D') return ownName();
  if(qid === 'next' && WID.indexOf(v) >= 0) return w('world_names')[v];
  if(qid === 'hard') return v === 'none' ? t('fb_hard_none') : ((w('intake')[v] || {}).label || v);
  return t('fb_' + qid + '_' + v);

function fbRadios(qid, opts){

    return '<label class="fb-opt"><input type="radio" name="fb-' + qid + '" value="' + esc(v) + '"'
      + (fbAns[qid] === v ? ' checked' : '') + '><span>' + esc(fbOptText(qid, v)) + '</span></label>';
  }).join('');
}
function fbRow(){
  var r = {wedge: D.wedge.id, variant: variant || null, lang: lang, demo: !!base.is_demo,
           real: fbAns.real || null, helped: fbAns.helped || null, next: fbAns.next || null,
           hard: fbAns.hard || null, missing: String(fbAns.miss || '').trim().slice(0, 500) || null,
           src: fbSource(), anon: anonId(FB_ANON)};

   The chart is drawn for a width, and inside a closed <details> it has none. It is drawn when
   the reader opens it, and again if they resize afterwards. */
document.getElementById('uk-try').addEventListener('click', function(){
  var tp = document.getElementById('testplan');
  tp.hidden = !tp.hidden;
  this.setAttribute('aria-expanded', String(!tp.hidden));
});

applyLanguage(lang, false);

/* A page that opens on the report is a page that answered a question nobody asked yet. The
   only way in that skips the questions is the explicit worked-example link. */
(function boot(){
  try {
    var savedVar = localStorage.getItem(VARIANT_KEY);
    if(variantIds().indexOf(savedVar) >= 0) setVariant(savedVar);
  } catch(e){}
  loadLoop();
  if(measureUsable()) sel[PRIMARY] = measure.band;
  loadOwn();
  /* A question routed from the home screen can carry an option and a trade. They are proposals
     the page shows; the owner's own figures are still asked for. */
  var ownQ = parseOwn(P.get('own'));
  if(ownQ && engineOK()){ own.p = ownQ.p; own.r = ownQ.r; own.on = true; saveOwn(); }
  var varQ = P.get('variant');
  if(varQ && variantIds().indexOf(varQ) >= 0) setVariant(varQ);
  document.getElementById('cursel').addEventListener('change', function(){ setCurrency(this.value); });
  // The flow rebuilds its own screen, so the one it shows is reached by delegation.
  document.getElementById('ask-body').addEventListener('change', function(e){
    if(e.target && e.target.id === 'cur-ask'){ setCurrency(e.target.value); renderAsk(); }
  });
  /* A shared link is a document someone was handed. It opens as that document, with its own
     figures, whatever this browser remembers about its owner's last visit. */
  var hashed = /(?:^#|&)sheet=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  // Links made before the figures moved into the fragment still open.
  var packedIn = (hashed && hashed[1]) || P.get('sheet');
  if(packedIn){
    var st = applySheet(packedIn);
    if(st){
      sheetState = st;
      render();
      showScreen('sheet');
      renderSheet();
      return;
    }
  }
  if(P.get('demo') === '1' || !FLOW.length){ finishAsk(true); return; }
  // The size of the change, when the question named one. It is shown on its step, not skipped.
  var shockQ = parseFloat(P.get('shock'));
  var hasShockQ = !!F.shock && isFinite(shockQ) && shockQ > 0 && shockQ <= 100;
  // Answers from last time mean last time's result, straight away.
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(saved){
      var complete = FLOW.every(function(st){
        return st.fields.every(function(f){ return isFinite(parseFloat(saved[f])); }); });
      if(complete){
        arrivedWithAnswers = true;
        FLOW.forEach(function(st){ st.fields.forEach(function(f){
          draft[f] = parseFloat(saved[f]); answered[f] = true; }); });
        // A new question means last time's answer is not this one's: walk the flow again.
        if(!hasShockQ && !validate(draft).length){ finishAsk(false); return; }
      }
    }
  } catch(e){}
  if(hasShockQ){ draft[F.shock] = shockQ; answered[F.shock] = true; }
  showScreen('ask');
  renderAsk();
})();
})();
</script>
</body>
</html>
